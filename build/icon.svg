<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!-- Dark fill circle background for visibility at small sizes -->
  <circle cx="50" cy="50" r="48" fill="#0f1117"/>
  <!-- Outer teal ring — thick enough to show at 16px -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#2ECFB6" stroke-width="6"/>
  <!-- Bold S-curve through center -->
  <path d="M 28 72 C 28 58, 42 52, 50 50 C 58 48, 72 42, 72 28"
        fill="none"
        stroke="#2ECFB6"
        stroke-width="8"
        stroke-linecap="round"/>
  <!-- Center dot — large enough to pop at 16px -->
  <circle cx="50" cy="50" r="5.5" fill="#2ECFB6"/>
</svg>
