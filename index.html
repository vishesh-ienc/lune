<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lune - Agent tracking dashboard</title>
<meta name="description" content="Monitor AI usage quota across multiple IDE accounts in a unified local dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>

/* ═══════════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
button { font-family: inherit; cursor: pointer; }

body {
  font-family: 'Inter', sans-serif;
  background: #09090b;
  color: #e4e4e7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-width: 900px;
}

/* ═══════════════════════════════════════════════════════
   APP LAYOUT — 3-COLUMN GRID
═══════════════════════════════════════════════════════ */
.app {
  display: grid;
  grid-template-columns: 64px 430px 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ═══════════════════════════════════════════════════════
   LEFT RAIL / SIDEBAR
═══════════════════════════════════════════════════════ */
.sidebar {
  background: #18181b;
  border-right: 1px solid #27272a;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0;
  z-index: 10;
}

.sidebar-logo {
  width: 36px;
  height: 36px;
  background: #27272a;
  border: 1px solid #3f3f46;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  flex-shrink: 0;
  transition: background .15s, border-color .15s;
}
.sidebar-logo:hover { background: #3f3f46; border-color: #71717a; }

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  width: 100%;
  padding: 0 8px;
  align-items: center;
}

/* ── TEMP: IPC bridge test button (remove in next phase) ── */
#ipc-test-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: rgba(129, 140, 248,.10);
  color: #818cf8;
  font-size: 16px;
  cursor: pointer;
  transition: background .15s, transform .1s;
  position: relative;
}
#ipc-test-btn:hover { background: rgba(129, 140, 248,.22); transform: translateY(-1px); }
#ipc-test-btn:active { transform: translateY(0); }
#ipc-test-btn[title]::after {
  content: attr(title);
  position: absolute;
  left: 52px; top: 50%;
  transform: translateY(-50%);
  background: #27272a;
  color: #e4e4e7;
  font-size: 11px;
  white-space: nowrap;
  padding: 3px 8px;
  border-radius: 5px;
  border: 1px solid #27272a;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s;
}
#ipc-test-btn:hover::after { opacity: 1; }
/* ──────────────────────────────────────────────── */

.sidebar-bottom {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  padding: 10px 8px 0;
  align-items: center;
  border-top: 1px solid #27272a;
  margin-top: 10px;
}

.nav-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #71717a;
  border: none;
  background: transparent;
  transition: background .15s, color .15s, transform .1s;
  position: relative;
}
.nav-btn:hover { background: #27272a; color: #a1a1aa; transform: translateY(-1px); }
.nav-btn.active { background: rgba(129, 140, 248,.12); color: #818cf8; }
.nav-btn.active::before {
  content: '';
  position: absolute;
  left: -8px; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 20px;
  background: #818cf8;
  border-radius: 0 3px 3px 0;
}

/* ═══════════════════════════════════════════════════════
   SHARED PANEL HEADER — exactly 84px tall
═══════════════════════════════════════════════════════ */
.panel-header {
  height: 84px;
  min-height: 84px;
  max-height: 84px;
  border-bottom: 1px solid #27272a;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 20px;
  flex-shrink: 0;
  background: #18181b;
}

/* ═══════════════════════════════════════════════════════
   MIDDLE COLUMN — ACCOUNTS LIST
═══════════════════════════════════════════════════════ */
.accounts-panel {
  border-right: 1px solid #27272a;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.panel-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: #e4e4e7;
  letter-spacing: -.01em;
}

.panel-subtitle {
  font-size: 11.5px;
  color: #71717a;
  margin-top: 4px;
}

.refresh-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #27272a;
  border: 1px solid #27272a;
  color: #a1a1aa;
  font-size: 11.5px;
  font-weight: 500;
  padding: 5px 11px;
  border-radius: 8px;
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.refresh-btn:hover { background: #27272a; color: #e4e4e7; border-color: #3f3f46; }
.refresh-icon { transition: transform .55s cubic-bezier(.4,0,.2,1); }
.refresh-btn.spinning .refresh-icon { transform: rotate(360deg); }

.add-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(129, 140, 248,.12);
  border: 1px solid rgba(129, 140, 248,.28);
  color: #818cf8;
  font-size: 11.5px;
  font-weight: 600;
  padding: 5px 11px;
  border-radius: 8px;
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.add-btn:hover { background: rgba(129, 140, 248,.22); border-color: rgba(129, 140, 248,.45); }

.unsynced-label {
  font-size: 10.5px;
  color: #71717a;
  font-style: italic;
}

.accounts-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}
.accounts-list::-webkit-scrollbar { width: 4px; }
.accounts-list::-webkit-scrollbar-track { background: transparent; }
.accounts-list::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }

/* ═══════════════════════════════════════════════════════
   ACCOUNT CARDS
═══════════════════════════════════════════════════════ */
.account-card {
  background: #18181b;
  border: 1px solid #27272a;
  border-left: 3px solid transparent;
  border-radius: 10px;
  padding: 12px 12px 10px;
  margin-bottom: 7px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 9px;
  transition: background .12s, border-color .12s, transform .1s;
  user-select: none;
  outline: none;
}
.account-card:hover  { background: #27272a; transform: translateX(1px); }
.account-card:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }
.account-card:active { transform: translateX(0); }

.account-card.selected             { background: rgba(129, 140, 248,.05); border-left-color: #818cf8; }
.account-card.selected.status-warn { background: rgba(251, 191, 36,.05); border-left-color: #fbbf24; }
.account-card.selected.status-crit { background: rgba(248, 113, 113,.05); border-left-color: #f87171; }

.card-top-row { display: flex; align-items: center; gap: 9px; }

.card-rank {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #71717a;
  width: 14px;
  flex-shrink: 0;
  text-align: center;
}

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px;
  font-weight: 700;
  color: rgba(255,255,255,.88);
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,.08);
}

.card-info { flex: 1; min-width: 0; }
.card-name  { font-size: 12.5px; font-weight: 600; color: #e4e4e7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-email { font-size: 11px; color: #71717a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

.launch-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  background: transparent;
  border: 1px solid #27272a;
  color: #71717a;
  font-size: 10.5px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 6px;
  transition: all .15s;
  flex-shrink: 0;
  white-space: nowrap;
}
.launch-btn:hover { background: #27272a; color: #a1a1aa; border-color: #3f3f46; }

.card-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.remove-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  background: transparent;
  border: 1px solid #27272a;
  color: #71717a;
  border-radius: 6px;
  transition: all .15s;
  flex-shrink: 0;
  cursor: pointer;
}
.remove-btn:hover {
  background: rgba(248, 113, 113, .12);
  color: #f87171;
  border-color: rgba(248, 113, 113, .3);
}

.card-quota-row { display: flex; align-items: center; gap: 9px; padding-left: 23px; }

.quota-bar-wrap {
  flex: 1;
  height: 4px;
  background: #27272a;
  border-radius: 99px;
  overflow: visible;
}
.quota-bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width .6s cubic-bezier(.4,0,.2,1);
}
/* Vivid traffic-light colors — these list bars are the "at a glance" signal */
.quota-bar-fill.healthy  { background: #34d399; }
.quota-bar-fill.warn     { background: #fbbf24; }
.quota-bar-fill.critical { background: #f87171; }

.quota-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: #a1a1aa;
  min-width: 30px;
  text-align: right;
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════════════════
   RIGHT — DETAIL PANEL
═══════════════════════════════════════════════════════ */
.detail-panel { display: flex; flex-direction: column; overflow: hidden; background: #09090b; }

.detail-panel .panel-header {
  flex-direction: row;
  align-items: center;
  gap: 12px;
  padding: 0 22px;
}

.detail-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: rgba(255,255,255,.88);
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,.1);
}

.detail-name-wrap { flex: 1; min-width: 0; }
.detail-name  { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; color: #e4e4e7; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.detail-email { font-size: 11.5px; color: #71717a; margin-top: 2px; }

.plan-badge {
  font-size: 10.5px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 99px;
  white-space: nowrap;
  border: 1px solid;
  flex-shrink: 0;
  letter-spacing: .01em;
}
.plan-badge.healthy  { background: rgba(129, 140, 248,.10); color: #818cf8; border-color: rgba(129, 140, 248,.28); }
.plan-badge.warn     { background: rgba(251, 191, 36,.10); color: #fbbf24; border-color: rgba(251, 191, 36,.28); }
.plan-badge.critical { background: rgba(248, 113, 113,.10); color: #f87171; border-color: rgba(248, 113, 113,.28); }

.launch-main-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  border: 1px solid rgba(129, 140, 248,.28);
  color: #818cf8;
  background: rgba(129, 140, 248,.08);
  font-size: 12.5px;
  font-weight: 600;
  padding: 7px 16px;
  border-radius: 8px;
  transition: all .18s;
  white-space: nowrap;
  flex-shrink: 0;
}
.launch-main-btn:hover {
  background: rgba(129, 140, 248,.15);
  border-color: rgba(129, 140, 248,.45);
  box-shadow: 0 0 18px rgba(129, 140, 248,.12);
  transform: translateY(-1px);
}
.launch-main-btn:active { transform: translateY(0); }

/* ─── Detail scrollable content ─── */
.detail-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 22px 16px;
}
.detail-content::-webkit-scrollbar { width: 4px; }
.detail-content::-webkit-scrollbar-track { background: transparent; }
.detail-content::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }

.section-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: #3f3f46;
  margin-bottom: 10px;
}

/* ═══════════════════════════════════════════════════════
   QUOTA POOL CARDS
═══════════════════════════════════════════════════════ */
.pools-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.pool-column {
  display: flex;
  flex-direction: column;
}

.pool-card {
  background: #18181b;
  border: 1px solid #27272a;
  border-radius: 12px;
  padding: 16px 18px 14px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  transition: border-color .15s, background .15s;
  cursor: default;
  user-select: none;
}
.pool-card:hover { background: #1f1f23; border-color: #3f3f46; }

.pool-card-header {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.pool-card-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.pool-card-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: #f4f4f5;
}
.pool-info-icon {
  width: 14px;
  height: 14px;
  color: #71717a;
  flex-shrink: 0;
  cursor: help;
  transition: color .15s;
}
.pool-info-icon:hover {
  color: #a1a1aa;
}
.pool-card-subtitle {
  font-size: 11px;
  font-weight: 500;
  color: #a1a1aa;
}
.pool-card-desc {
  font-size: 11.5px;
  color: #71717a;
  line-height: 1.45;
}
.pool-card-body {
  margin-top: 2px;
  margin-bottom: 2px;
}
.pool-pct-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.pool-pct-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 26px;
  font-weight: 700;
  line-height: 1;
}
.compact-ring-svg {
  flex-shrink: 0;
}

.ring-container { position: relative; width: 90px; height: 90px; flex-shrink: 0; }
.ring-container svg { position: absolute; inset: 0; overflow: visible; }
.ring-label {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1px;
}
.ring-pct { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 600; line-height: 1; }
.ring-sublabel { font-size: 9px; color: #71717a; text-transform: uppercase; letter-spacing: .06em; }

.pool-info { text-align: center; width: 100%; }
.pool-name { font-family: 'Space Grotesk', sans-serif; font-size: 12.5px; font-weight: 700; color: #e4e4e7; margin-bottom: 5px; }
.pool-models { font-size: 10.5px; color: #71717a; line-height: 1.65; margin-bottom: 7px; }
.pool-reset { font-size: 10.5px; color: #71717a; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; }
.pool-reset-val { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #a1a1aa; }

/* ═══════════════════════════════════════════════════════
   STAT GRID (3 columns)
═══════════════════════════════════════════════════════ */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 16px; }

.stat-card {
  background: #18181b;
  border: 1px solid #27272a;
  border-radius: 10px;
  padding: 13px 12px 11px;
  transition: border-color .15s, background .15s;
}
.stat-card:hover { background: #27272a; }

.stat-label {
  font-size: 10.5px;
  color: #71717a;
  margin-bottom: 9px;
  display: inline-block;
  line-height: 1.3;
}
.stat-label.has-tooltip {
  border-bottom: 1px dashed #3f3f46;
  cursor: help;
  transition: border-color .15s, color .15s;
}
.stat-label.has-tooltip:hover { border-bottom-color: #71717a; color: #a1a1aa; }

.stat-value { font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 600; color: #e4e4e7; line-height: 1; display: block; }
.stat-sub { font-size: 10px; color: #71717a; margin-top: 5px; }

/* ═══════════════════════════════════════════════════════
   SYNC ROW
═══════════════════════════════════════════════════════ */
.sync-row { display: flex; align-items: center; gap: 8px; padding-top: 14px; border-top: 1px solid #27272a; }
.sync-text { font-size: 11.5px; color: #71717a; flex: 1; }
.sync-time { font-family: 'JetBrains Mono', monospace; color: #a1a1aa; }

.refresh-acc-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: 1px solid #27272a;
  color: #818cf8;
  font-size: 11px;
  font-weight: 500;
  padding: 5px 11px;
  border-radius: 8px;
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.refresh-acc-btn:hover { background: rgba(129, 140, 248,.08); border-color: rgba(129, 140, 248,.35); color: #a5b4fc; }
.refresh-acc-btn .refresh-icon { width: 11px; height: 11px; transition: transform .55s cubic-bezier(.4,0,.2,1); }
.refresh-acc-btn.spinning .refresh-icon { transform: rotate(360deg); }

.pulse-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; position: relative; }
.pulse-dot::after { content: ''; position: absolute; inset: 0; border-radius: 50%; animation: pulse-ring 2.2s ease-out infinite; }
.pulse-dot.healthy  { background: #818cf8; }
.pulse-dot.healthy::after  { background: rgba(129, 140, 248,.45); }
.pulse-dot.warn     { background: #fbbf24; }
.pulse-dot.warn::after     { background: rgba(251, 191, 36,.45); }
.pulse-dot.critical { background: #f87171; }
.pulse-dot.critical::after { background: rgba(248, 113, 113,.45); }

/* Live online indicator — steady (no animation), visually distinct from pulsing quota dots */
.card-live-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(34, 197, 94, 0.10);
  border: 1px solid rgba(34, 197, 94, 0.28);
  border-radius: 4px;
  padding: 1.5px 6px;
  flex-shrink: 0;
}
.card-live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #22c55e;
  flex-shrink: 0;
  /* NO ::after animation — keeps it visually distinct from .pulse-dot */
}
.card-live-label {
  font-size: 9.5px;
  font-weight: 600;
  color: #4ade80;
  letter-spacing: 0.03em;
  line-height: 1;
}


@keyframes pulse-ring {
  0%   { transform: scale(1);   opacity: .9; }
  65%  { transform: scale(2.8); opacity: 0;  }
  100% { transform: scale(1);   opacity: 0;  }
}
@keyframes livePulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.35; }
}

/* ═══════════════════════════════════════════════════════
   FLOATING TOOLTIP
═══════════════════════════════════════════════════════ */
.tooltip {
  position: fixed;
  z-index: 9999;
  background: #27272a;
  border: 1px solid #3f3f46;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 11.5px;
  color: #a1a1aa;
  max-width: 230px;
  line-height: 1.55;
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .15s ease, transform .15s ease;
  box-shadow: 0 8px 28px rgba(0,0,0,.5);
  white-space: pre-line;
}
.tooltip.visible { opacity: 1; transform: translateY(0); }

/* ═══════════════════════════════════════════════════════
   MODAL DIALOG
═══════════════════════════════════════════════════════ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}
.modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}
.modal-card {
  background: #18181b;
  border: 1px solid #27272a;
  border-radius: 14px;
  width: 380px;
  max-width: 90vw;
  padding: 22px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.6);
  transform: translateY(8px);
  transition: transform .2s ease;
}
.modal-backdrop.open .modal-card {
  transform: translateY(0);
}

/* ═══════════════════════════════════════════════════════
   MOCK DATA — shaped to match the real API response:
   each pool exposes a remainingFraction (0–1), and each
   model within a pool has its own independent fraction.
═══════════════════════════════════════════════════════ */
const ACCOUNTS = [];

/* Stage label mapping for real account refresh progress reporting */
const STAGE_LABELS = {
  'auth-check':  'Checking login…',
  'launching':   'Launching…',
  'waiting-lsp': 'Starting LSP…',
  'querying':    'Fetching status…',
  'cleanup':     'Cleaning up…',
  'done':        '',
};

/* ═══════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════ */
const AVATAR_PALETTE = ['#1A4038', '#142040', '#3D2010', '#3D1212', '#2A1B40', '#1B3D38', '#382E1B', '#143840'];

function deriveInitials(name) {
  if (!name) return '??';
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 2) {
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  return name.trim().slice(0, 2).toUpperCase();
}

function status(pct) { return pct >= 85 ? 'healthy' : pct >= 15 ? 'warn' : 'critical'; }
const MUTED = { healthy: '#818cf8', warn: '#fbbf24', critical: '#f87171' };
const fmt   = n  => (n || 0).toLocaleString();
const words = tk => Math.round((tk || 0) * 0.75).toLocaleString();
const esc   = s  => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pctOf = frac => +(frac * 100).toFixed(2);

/**
 * HEURISTIC: Inferred from reset-time distance, NOT an explicit field from the API.
 * The API (GetUserStatus) returns a single active remainingFraction and resetTime per model,
 * representing whichever limit (5-Hour vs. Weekly) is currently more restrictive.
 * We infer the label based on how far away resetTime is from the current time:
 *   - 0 to 5.5 hours -> "5-Hour Limit"
 *   - 5.5 hours to ~7.5 days (180 hours) -> "Weekly Limit"
 *   - Outside these ranges -> "Limit" (generic fallback)
 */
function getConstraintLabel(rt, resetInStr) {
  if (!rt && !resetInStr) return 'Limit';
  let diffHrs = null;
  try {
    if (rt) {
      const d = new Date(rt);
      if (!isNaN(d.getTime())) {
        diffHrs = (d.getTime() - Date.now()) / (1000 * 60 * 60);
      }
    }
    if (diffHrs === null && (resetInStr || rt)) {
      const str = String(resetInStr || rt);
      const dMatch = str.match(/(\d+)\s*d/i);
      const hMatch = str.match(/(\d+)\s*h/i);
      const mMatch = str.match(/(\d+)\s*m/i);
      if (dMatch || hMatch || mMatch) {
        const days = dMatch ? parseInt(dMatch[1], 10) : 0;
        const hours = hMatch ? parseInt(hMatch[1], 10) : 0;
        const mins = mMatch ? parseInt(mMatch[1], 10) : 0;
        diffHrs = days * 24 + hours + mins / 60;
      }
    }
  } catch (e) {
    diffHrs = null;
  }

  if (diffHrs === null || isNaN(diffHrs) || diffHrs < 0) {
    return 'Limit';
  }
  if (diffHrs <= 5.5) {
    return '5-Hour Limit';
  }
  if (diffHrs <= 180) { // up to ~7.5 days
    return 'Weekly Limit';
  }
  return 'Limit';
}

/**
 * Compact reset sentence generator:
 * Formats "Refreshes in <duration> (<month> <day>, <time> IST)"
 * using explicit Asia/Kolkata (UTC+5:30) timezone conversion with 12-hour AM/PM format.
 */
function formatCompactResetSentence(rt, resetInStr) {
  let targetDate = null;
  let durationStr = '';

  if (rt) {
    const d = new Date(rt);
    if (!isNaN(d.getTime())) {
      targetDate = d;
      const diffMs = Math.max(0, d.getTime() - Date.now());
      const diffMins = Math.floor(diffMs / (1000 * 60));
      const diffHrs = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHrs / 24);
      const remHrs = diffHrs % 24;
      const remMins = diffMins % 60;

      if (diffDays > 0) {
        durationStr = `${diffDays}d ${remHrs}h`;
      } else if (remHrs > 0) {
        durationStr = `${remHrs}h ${remMins}m`;
      } else {
        durationStr = `${remMins}m`;
      }
    }
  }

  if (!durationStr && resetInStr) {
    durationStr = resetInStr;
    const str = String(resetInStr);
    const dMatch = str.match(/(\d+)\s*d/i);
    const hMatch = str.match(/(\d+)\s*h/i);
    const mMatch = str.match(/(\d+)\s*m/i);
    if (dMatch || hMatch || mMatch) {
      const days = dMatch ? parseInt(dMatch[1], 10) : 0;
      const hours = hMatch ? parseInt(hMatch[1], 10) : 0;
      const mins = mMatch ? parseInt(mMatch[1], 10) : 0;
      const totalMs = (days * 86400 + hours * 3600 + mins * 60) * 1000;
      targetDate = new Date(Date.now() + totalMs);
    }
  }

  if (!durationStr) durationStr = 'N/A';

  if (!targetDate || isNaN(targetDate.getTime())) {
    return `Refreshes in ${durationStr}`;
  }

  try {
    const month = targetDate.toLocaleDateString('en-US', { timeZone: 'Asia/Kolkata', month: 'short' });
    const day = targetDate.toLocaleDateString('en-US', { timeZone: 'Asia/Kolkata', day: 'numeric' });
    const timeStr = targetDate.toLocaleTimeString('en-US', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit', hour12: true });

    return `Refreshes in ${durationStr} (${month} ${day}, ${timeStr} IST)`;
  } catch (e) {
    return `Refreshes in ${durationStr}`;
  }
}

function compactRing(pct, st) {
  const r = 11;
  const circ = 2 * Math.PI * r;
  const safePct = Math.min(100, Math.max(0, pct));
  const arc = +(circ * safePct / 100).toFixed(2);
  const gap = +(circ - arc).toFixed(2);
  const col = MUTED[st];
  return `
    <svg class="compact-ring-svg" viewBox="0 0 28 28" width="22" height="22" aria-hidden="true" style="overflow:visible">
      <circle cx="14" cy="14" r="${r}" fill="none" stroke="#27272a" stroke-width="3.5"/>
      <circle cx="14" cy="14" r="${r}" fill="none"
        stroke="${col}" stroke-width="3.5"
        stroke-dasharray="${arc} ${gap}" stroke-linecap="round"
        transform="rotate(-90 14 14)"/>
    </svg>`;
}

function findPrimaryModel(poolName, models) {
  if (!models || models.length === 0) return null;
  if (/gemini/i.test(poolName)) {
    return models.find(m => /2\.0 flash/i.test(m.name)) ||
           models.find(m => /1\.5 pro/i.test(m.name)) ||
           models.find(m => /2\.0 pro/i.test(m.name)) ||
           models[0];
  } else {
    return models.find(m => /3\.5 sonnet/i.test(m.name)) ||
           models.find(m => /sonnet/i.test(m.name)) ||
           models.find(m => /gpt-4o/i.test(m.name)) ||
           models[0];
  }
}

function buildPoolFromGroup(poolName, models) {
  if (!models || models.length === 0) {
    return {
      name: poolName,
      remainingFraction: 0,
      resetTime: null,
      resetIn: 'N/A',
      models: [],
      hasDiscrepancy: false,
      discrepancyDetails: null
    };
  }

  const rep = findPrimaryModel(poolName, models) || models[0];
  let hasFracDiscrepancy = false;
  let hasResetDiscrepancy = false;

  for (let i = 0; i < models.length; i++) {
    if (Math.abs((models[i].fraction ?? 0) - (rep.fraction ?? 0)) > 0.0001) {
      hasFracDiscrepancy = true;
    }
    if (models[i].resetTime !== rep.resetTime) {
      hasResetDiscrepancy = true;
    }
  }

  const hasDiscrepancy = hasFracDiscrepancy || hasResetDiscrepancy;
  let discrepancyDetails = null;
  if (hasDiscrepancy) {
    discrepancyDetails = models.map(m => `${m.name}: frac=${m.fraction}, reset=${m.resetTime}`).join('; ');
    console.warn(`[Lune] Model quota variance in ${poolName} (primary: ${rep.name}):`, discrepancyDetails);
  }

  return {
    name: poolName,
    remainingFraction: rep.fraction ?? 1.0,
    resetTime: rep.resetTime || null,
    resetIn: formatResetTime(rep.resetTime),
    primaryModelName: rep.name,
    fiveHourRemainingFraction: rep.fiveHourRemainingFraction ?? null,
    fiveHourResetTime: rep.fiveHourResetTime || null,
    fiveHourResetIn: formatResetTime(rep.fiveHourResetTime),
    models: models,
    hasDiscrepancy,
    discrepancyDetails
  };
}

function getClockTime(str) {
  if (!str) return '';
  const dMatch = str.match(/(\d+)d/);
  const hMatch = str.match(/(\d+)h/);
  const days = dMatch ? parseInt(dMatch[1], 10) : 0;
  const hours = hMatch ? parseInt(hMatch[1], 10) : 0;
  const target = new Date(Date.now() + (days * 86400 + hours * 3600) * 1000);
  const month = target.toLocaleDateString('en-US', { month: 'short' });
  const day = target.getDate();
  const timeStr = target.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  return `${month} ${day}, ${timeStr}`;
}

function formatResetTime(rt) {
  if (!rt) return 'N/A';
  try {
    const d = new Date(rt);
    if (isNaN(d.getTime())) return String(rt);
    const diffMs = d.getTime() - Date.now();
    if (diffMs <= 0) return 'Resetting...';
    const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
    const diffDays = Math.floor(diffHrs / 24);
    const remHrs = diffHrs % 24;
    if (diffDays > 0) return `${diffDays}d ${remHrs}h`;
    return `${diffHrs}h`;
  } catch (e) {
    return String(rt);
  }
}

function formatDurationCompact(rt, fallbackStr) {
  if (rt) {
    const d = new Date(rt);
    if (!isNaN(d.getTime())) {
      const diffMs = d.getTime() - Date.now();
      if (diffMs <= 0) return 'Resetting...';
      const diffMins = Math.floor(diffMs / (1000 * 60));
      const diffHrs = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHrs / 24);
      const remHrs = diffHrs % 24;
      const remMins = diffMins % 60;

      if (diffDays > 0) {
        return `${diffDays}d ${remHrs}h`;
      } else if (remHrs > 0) {
        return `${remHrs}h ${remMins}m`;
      } else {
        return `${remMins}m`;
      }
    }
  }
  return fallbackStr || 'N/A';
}

/* Dispatcher for account refresh: real execution for accounts with a stored profile path, mock logic for legacy demo accounts, unlinked state for unconfigured accounts */
function refreshAccountObj(acc) {
  if (!acc) return;
  const targetProfile = acc.profilePath || acc.userDataDir;
  if (targetProfile) {
    refreshRealAccount(acc);
    return;
  }
  if (acc.isMock) {
    mockRefreshAccountObj(acc);
    return;
  }
  // Genuinely unlinked account (no stored profile path): keep empty / unlinked state
  acc.refreshError = 'Not synced yet (no profile linked)';
  renderCards();
  if (selectedId === acc.id) renderDetail();
}

/* Applies API refresh payload (from manual refresh or live background watcher) to an account object */
function applyRefreshResultToAccount(acc, result) {
  if (!acc || !result) return;
  acc.refreshStatusLabel = '';

  if (result.status === 'wrong-account-active' || result.error === 'wrong-account-active') {
    acc.wrongAccountActive = true;
    acc.refreshError = result.message || 'Currently signed in with a different account — switch or launch this account\'s own window to refresh.';
    // Auto-clear after 3s — this is a transient "different account is active right now" signal,
    // not a permanent error. The quota data is unaffected; only the warning badge fades away.
    const clearId = acc.id;
    setTimeout(() => {
      const target = ACCOUNTS.find(a => a.id === clearId);
      if (target && target.wrongAccountActive) {
        target.wrongAccountActive = false;
        target.refreshError = null;
        renderCards();
        if (selectedId === clearId) renderDetail();
      }
    }, 3000);
    return;
  }

  if (result.unreachable || result.status === 'unreachable' || result.error === 'unreachable') {
    acc.unreachable = true;
    acc.refreshError = null;
    return;
  }

  acc.wrongAccountActive = false;

  if (!result.authenticated) {
    acc.authenticated = false;
    acc.refreshError = 'Not authenticated (login required)';
    return;
  }
  if (result.error) {
    acc.authenticated = true;
    acc.refreshError = result.error;
    return;
  }

  if (result.ok) {
    acc.authenticated = true;
    acc.unreachable = false;
    acc.refreshError = null;

    // Part 8: lastSync updated ONLY on confirmed success
    acc.lastSync = Date.now();
    acc.lastSyncSource = result.lastSyncSource || 'manual';

    if (result.name) {
      acc.name = result.name;
      acc.initials = deriveInitials(result.name);
    }
    if (result.email) {
      acc.email = result.email;
    }

    acc.planName = result.planName || null;
    acc.teamsTier = result.teamsTier || null;
    acc.userTierName = result.userTierName || null;
    acc.plan = result.userTierName || result.planName || result.teamsTier || (acc.plan || 'Google AI Pro');

    acc.promptCredits = result.promptCredits || acc.promptCredits || null;
    acc.flowCredits = result.flowCredits || acc.flowCredits || null;

    // Part 9 (renderer guard): Only overwrite modelQuotas and pools when the incoming result
    // actually contains real quota data. An empty or missing modelQuotas means the API response
    // lacked cascadeModelConfigData — leave the last known pools/quotaPercent intact.
    if (Array.isArray(result.modelQuotas) && result.modelQuotas.length > 0) {
      acc.modelQuotas = result.modelQuotas;

      let maxTokens = 16384;
      if (result.body || result.raw) {
        try {
          const parsedBody = JSON.parse(result.body || result.raw);
          const rawTokens = parsedBody.userStatus?.planStatus?.planInfo?.maxNumChatInputTokens;
          if (rawTokens) maxTokens = parseInt(rawTokens, 10) || 16384;
        } catch (e) {}
      }

      let earliestReset = null;
      let earliestResetMs = Infinity;
      acc.modelQuotas.forEach(m => {
        if (m.resetTime) {
          const ms = new Date(m.resetTime).getTime();
          if (!isNaN(ms) && ms < earliestResetMs) {
            earliestResetMs = ms;
            earliestReset = m.resetTime;
          }
        }
      });
      const resetInFormatted = earliestReset ? formatResetTime(earliestReset) : (acc.modelQuotas[0]?.resetTime ? formatResetTime(acc.modelQuotas[0].resetTime) : 'N/A');

      const promptAvail = acc.promptCredits?.available ?? 0;
      const promptMonthly = acc.promptCredits?.monthly ?? 1;
      const flowAvail = acc.flowCredits?.available ?? 0;
      const flowMonthly = acc.flowCredits?.monthly ?? 1;

      acc.hasQuotaData = true;
      acc.stats = {
        promptCredits: { rem: promptAvail, tot: promptMonthly },
        flowCredits: { rem: flowAvail, tot: flowMonthly },
        maxInputTokens: maxTokens,
        nextReset: resetInFormatted
      };

      const geminiModels = [];
      const claudeGptModels = [];
      acc.modelQuotas.forEach(m => {
        const label = m.label || m.name || 'Unknown Model';
        const item = {
          name: label,
          tag: m.tagTitle || (m.remainingFraction !== null && m.remainingFraction > 0.8 ? 'FAST' : null),
          fraction: m.remainingFraction ?? 0,
          resetTime: m.resetTime,
          fiveHourRemainingFraction: m.fiveHourRemainingFraction ?? null,
          fiveHourResetTime: m.fiveHourResetTime || null,
        };
        if (/gemini/i.test(label)) geminiModels.push(item);
        else claudeGptModels.push(item);
      });

      acc.pools = [
        buildPoolFromGroup('Gemini Models', geminiModels),
        buildPoolFromGroup('Claude and GPT models', claudeGptModels)
      ];

      // Part 3: Clear estimated flag on real refresh
      acc.pools.forEach(p => { p.resetIsEstimated = false; });

      const maxFrac = acc.pools.length > 0 ? Math.max(...acc.pools.map(p => p.remainingFraction)) : 1.0;
      acc.quotaPercent = Math.round(maxFrac * 100);
    } else {
      // No real model quota data in this result — leave existing pools/quotaPercent/stats unchanged
      console.info('[Lune renderer] live-account-update received ok:true but no modelQuotas data — pools left unchanged.');
    }
  }
}

/* Real account refresh workflow using IPC bridge (lib/antigravity.js via main process) */
async function refreshRealAccount(acc) {
  if (!acc) return;

  const profilePath = acc.profilePath || acc.userDataDir;
  if (!profilePath) {
    acc.refreshError = 'No profile path configured';
    renderCards();
    if (selectedId === acc.id) renderDetail();
    return;
  }

  if (typeof window.api === 'undefined' || typeof window.api.refreshAccount !== 'function') {
    console.warn('[Lune] window.api.refreshAccount not available');
    if (acc.isMock) mockRefreshAccountObj(acc);
    return;
  }

  acc.refreshError = null;
  acc.wrongAccountActive = false;
  acc.refreshStatusLabel = STAGE_LABELS['auth-check'];
  renderCards();
  if (selectedId === acc.id) renderDetail();

  const unsub = window.api.onRefreshStatus(({ accountId, stage }) => {
    if (accountId === acc.id) {
      acc.refreshStatusLabel = STAGE_LABELS[stage] !== undefined ? STAGE_LABELS[stage] : stage;
      renderCards();
      if (selectedId === acc.id) renderDetail();
    }
  });

  try {
    const result = await window.api.refreshAccount(profilePath, acc.id);
    console.info('[Lune] Real refresh result for', acc.name, result);
    applyRefreshResultToAccount(acc, result);
  } catch (err) {
    console.error('[Lune] Real refresh call threw exception:', err);
    acc.refreshStatusLabel = '';
    acc.refreshError = err.message || 'Refresh failed';
  } finally {
    unsub();
    saveCurrentAccounts();
    renderCards();
    if (selectedId === acc.id) renderDetail();
  }
}

function saveCurrentAccounts() {
  if (typeof window.api !== 'undefined' && typeof window.api.saveAccounts === 'function') {
    const toSave = ACCOUNTS.map(a => {
      const clone = { ...a };
      delete clone.refreshStatusLabel;
      return clone;
    });
    window.api.saveAccounts(toSave).catch(err => {
      console.warn('[Lune] saveAccounts failed:', err);
    });
  }
}

/* Mock refresh helper for secondary accounts — nudges numbers and records previousSnapshot for diffing */
function mockRefreshAccountObj(acc) {
  if (!acc) return;
  // If account has existing pools & stats, snapshot them before updating
  if (acc.pools && acc.pools.length > 0 && acc.stats) {
    acc.previousSnapshot = {
      pools: acc.pools.map(p => ({
        name: p.name,
        remainingFraction: p.remainingFraction,
        resetIn: p.resetIn
      })),
      promptCredits: acc.stats.promptCredits ? acc.stats.promptCredits.rem : 0,
      flowCredits: acc.stats.flowCredits ? acc.stats.flowCredits.rem : 0,
      capturedAt: acc.lastSync || Date.now()
    };
  }

  // If brand-new unlinked account being synced for first time:
  if (!acc.pools || acc.pools.length === 0) {
    acc.plan = 'Google AI Pro';
    acc.pools = [
      { name: 'Gemini Models', remainingFraction: 0.9500, resetTime: '2026-08-11T12:00:00Z', resetIn: '14d 6h',
        models: [
          { name: 'Gemini 2.0 Flash', tag: 'fast', fraction: 0.9650 },
          { name: 'Gemini 1.5 Pro', tag: null, fraction: 0.9350 },
          { name: 'Gemini 2.0 Pro', tag: 'recommended', fraction: 0.9500 },
        ] },
      { name: 'Claude and GPT models', remainingFraction: 0.9000, resetTime: '2026-08-11T12:00:00Z', resetIn: '14d 6h',
        models: [
          { name: 'Claude 3.5 Sonnet', tag: 'recommended', fraction: 0.9150 },
          { name: 'GPT-4o', tag: null, fraction: 0.8850 },
          { name: 'Claude 3 Opus', tag: null, fraction: 0.8750 },
        ] },
    ];
    acc.stats = {
      promptCredits: { rem: 4750, tot: 5000 },
      flowCredits: { rem: 450, tot: 500 },
      maxInputTokens: 128000,
      nextReset: '14d 6h'
    };
    acc.quotaPercent = 95;
    acc.lastSync = Date.now();
    return;
  }

  // Update existing pool & stat values with small realistic deltas
  const isReset = Math.random() < 0.25; // 25% chance of quota reset to test new cycle logic

  acc.pools.forEach(p => {
    if (isReset) {
      // Advance resetIn to simulate a new cycle starting
      const resetCycle = ['14d 6h', '14d 12h', '15d 0h', '14d 18h'];
      const nextIdx = (resetCycle.indexOf(p.resetIn) + 1) % resetCycle.length;
      p.resetIn = resetCycle[nextIdx === -1 ? 0 : nextIdx];
      p.remainingFraction = 1.0000;
      p.models.forEach(m => m.fraction = 1.0000);
    } else {
      // Normal usage case: keep resetIn SAME as before, decrease fraction
      const drop = +(Math.random() * 0.035 + 0.005).toFixed(4); // 0.5% to 4.0% drop
      p.remainingFraction = Math.max(0.0100, +(p.remainingFraction - drop).toFixed(4));
      p.models.forEach(m => {
        m.fraction = Math.max(0.0100, +(m.fraction - drop * (0.8 + Math.random() * 0.4)).toFixed(4));
      });
    }
  });

  if (isReset) {
    acc.stats.nextReset = acc.pools[0].resetIn;
    acc.stats.promptCredits.rem = acc.stats.promptCredits.tot;
    acc.stats.flowCredits.rem = acc.stats.flowCredits.tot;
  } else {
    const promptDrop = Math.floor(Math.random() * 180 + 20);
    const flowDrop = Math.floor(Math.random() * 20 + 2);
    acc.stats.promptCredits.rem = Math.max(0, acc.stats.promptCredits.rem - promptDrop);
    acc.stats.flowCredits.rem = Math.max(0, acc.stats.flowCredits.rem - flowDrop);
  }

  const maxFrac = Math.max(...acc.pools.map(p => p.remainingFraction));
  acc.quotaPercent = Math.round(maxFrac * 100);
  acc.lastSync = Date.now();
  saveCurrentAccounts();
}

function getPoolDeltaInfo(acc, pool) {
  if (!acc.previousSnapshot || !acc.previousSnapshot.pools) return null;
  const prevP = acc.previousSnapshot.pools.find(x => x.name === pool.name);
  if (!prevP) return null;

  // Key off resetTime (resetIn) equality first
  if (pool.resetIn !== prevP.resetIn) {
    return { text: '▲ Quota reset — new cycle', cls: 'up' };
  }

  // Same cycle: compare remainingFraction
  const deltaFrac = pool.remainingFraction - prevP.remainingFraction;
  const deltaPct = Math.abs(deltaFrac * 100);

  if (deltaFrac < -0.001) {
    return { text: `▼ ${deltaPct.toFixed(1)}% used`, cls: 'down' };
  } else {
    return { text: 'No change since last sync', cls: 'same' };
  }
}

function getSyncDeltaSummary(acc) {
  if (!acc.previousSnapshot) return '';
  const prevPrompts = acc.previousSnapshot.promptCredits;
  const currPrompts = acc.stats ? acc.stats.promptCredits.rem : 0;
  const usedPrompts = prevPrompts - currPrompts;

  if (usedPrompts > 0) {
    return `used ${fmt(usedPrompts)} prompt credits since then`;
  } else if (usedPrompts < 0) {
    return `Quota reset — new cycle`;
  } else {
    return `No change since last sync`;
  }
}

/* ═══════════════════════════════════════════════════════
   SVG RING
═══════════════════════════════════════════════════════ */
function ring(pct, st) {
  const r    = 37;
  const circ = 2 * Math.PI * r;
  const arc  = +(circ * pct / 100).toFixed(3);
  const gap  = +(circ - arc).toFixed(3);
  const col  = MUTED[st];
  const uid  = 'f' + Math.random().toString(36).slice(2, 8);
  return `
    <svg viewBox="0 0 100 100" width="90" height="90" style="overflow:visible" aria-hidden="true">
      <defs>
        <filter id="${uid}" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="#27272a" stroke-width="9"/>
      <circle cx="50" cy="50" r="${r}" fill="none"
        stroke="${col}" stroke-width="8"
        stroke-dasharray="${arc} ${gap}" stroke-linecap="round"
        transform="rotate(-90, 50, 50)" filter="url(#${uid})"/>
    </svg>
    <div class="ring-label">
      <span class="ring-pct" style="color:${col}">${pct}%</span>
      <span class="ring-sublabel">left</span>
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════ */
let selectedId = ACCOUNTS.length > 0 ? ACCOUNTS[0].id : null;
let lastSync   = Date.now();
// Part 10: In-memory set of account IDs that currently have a confirmed live matched process.
// Starts empty — the watcher flips these on first confirmed match, ~5s after startup.
const onlineAccountIds = new Set();

function getInitials(name) {
  if (!name) return '??';
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return name.slice(0, 2).toUpperCase();
}

function getAvatarBg(key) {
  const colors = [
    'linear-gradient(135deg, #6366f1, #4f46e5)',
    'linear-gradient(135deg, #8b5cf6, #7c3aed)',
    'linear-gradient(135deg, #ec4899, #db2777)',
    'linear-gradient(135deg, #10b981, #059669)',
    'linear-gradient(135deg, #3b82f6, #2563eb)'
  ];
  let hash = 0;
  const str = key || 'default';
  for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

/* ═══════════════════════════════════════════════════════
   RENDER — ACCOUNT CARDS
═══════════════════════════════════════════════════════ */
function renderCards() {
  const list = document.getElementById('accounts-list');
  if (ACCOUNTS.length === 0) {
    list.innerHTML = `<div style="padding: 30px 14px; text-align: center; color: #71717a; font-size: 12px; line-height: 1.5;">No accounts registered.<br>Click <strong style="color:#818cf8">Add account</strong> above to add one.</div>`;
    return;
  }

  const sortedAccounts = [...ACCOUNTS].sort((a, b) => {
    // 1. Online (Live) accounts stay at the top
    const aOnline = onlineAccountIds.has(a.id) ? 1 : 0;
    const bOnline = onlineAccountIds.has(b.id) ? 1 : 0;
    if (aOnline !== bOnline) return bOnline - aOnline;

    // 2. Highest available usage (quotaPercent) stays up
    const aPct = (a.quotaPercent !== null && a.quotaPercent !== undefined) ? a.quotaPercent : -1;
    const bPct = (b.quotaPercent !== null && b.quotaPercent !== undefined) ? b.quotaPercent : -1;
    if (aPct !== bPct) return bPct - aPct;

    // 3. Fallback: Stable sort by name
    return (a.name || '').localeCompare(b.name || '');
  });

  list.innerHTML = sortedAccounts.map((acc, index) => {
    const displayRank = index + 1;
    acc.rank = displayRank;
    const isUnsynced = acc.quotaPercent === null || acc.quotaPercent === undefined;
    const st  = isUnsynced ? '' : status(acc.quotaPercent);
    const sel = acc.id === selectedId;
    const cls = 'account-card' +
      (sel ? ' selected' + (st === 'warn' ? ' status-warn' : st === 'critical' ? ' status-crit' : '') : '');

    const hasPools = Array.isArray(acc.pools) && acc.pools.length > 0;
    let cardCountdownsHtml = '';
    if (hasPools && !acc.refreshStatusLabel && !acc.wrongAccountActive && acc.authenticated !== false && !acc.refreshError) {
      const gPool = acc.pools.find(p => /gemini/i.test(p.name));
      const cPool = acc.pools.find(p => /claude|gpt/i.test(p.name));
      const gTime = gPool ? formatDurationCompact(gPool.resetTime, gPool.resetIn) : 'N/A';
      const cTime = cPool ? formatDurationCompact(cPool.resetTime, cPool.resetIn) : 'N/A';
      const gEst = gPool && gPool.resetIsEstimated ? ' (Est)' : '';
      const cEst = cPool && cPool.resetIsEstimated ? ' (Est)' : '';

      cardCountdownsHtml = `

let accountIdToDelete = null;

function promptRemoveAccount(id) {
  const acc = ACCOUNTS.find(a => a.id === id);
  if (!acc) return;
  accountIdToDelete = id;
  const body = document.getElementById('delete-modal-body');
  if (body) {
    body.innerHTML = `Are you sure you want to stop tracking <strong style="color:#f4f4f5;">${esc(acc.name || acc.email)}</strong> (${esc(acc.email)}) in Lune?`;
  }
  const modal = document.getElementById('delete-modal');
  if (modal) modal.classList.add('open');
}

function closeDeleteModal() {
  const modal = document.getElementById('delete-modal');
  if (modal) modal.classList.remove('open');
  accountIdToDelete = null;
}

document.getElementById('delete-modal-close')?.addEventListener('click', closeDeleteModal);
document.getElementById('delete-modal-cancel')?.addEventListener('click', closeDeleteModal);
document.getElementById('delete-modal-confirm')?.addEventListener('click', async () => {
  if (accountIdToDelete !== null) {
    const id = accountIdToDelete;
    closeDeleteModal();
    await removeAccount(id);
  }
});
const delModal = document.getElementById('delete-modal');
delModal?.addEventListener('click', e => { if (e.target === delModal) closeDeleteModal(); });

async function removeAccount(id) {
  const index = ACCOUNTS.findIndex(a => a.id === id);
  if (index === -1) return;

  const removedEmail = ACCOUNTS[index].email;
  ACCOUNTS.splice(index, 1);
  ACCOUNTS.forEach((a, i) => { a.rank = i + 1; });

  if (selectedId === id) {
    if (ACCOUNTS.length > 0) {
      selectedId = ACCOUNTS[Math.min(index, ACCOUNTS.length - 1)].id;
    } else {
      selectedId = null;
    }
  }

  renderCards();
  renderDetail();

  // Call main process to remove from in-memory store & disk
  if (typeof window.api?.removeAccount === 'function') {
    await window.api.removeAccount(id);
  } else {
    await saveCurrentAccounts();
  }

  // Confirmation Toast
  const toast = document.createElement('div');
  toast.style.cssText = `position:fixed;bottom:24px;right:24px;z-index:9999;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.35);color:#f87171;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 4px 24px rgba(0,0,0,0.4);pointer-events:none;animation:fadeIn 0.2s ease;`;
  toast.textContent = `✓ Removed ${removedEmail || 'account'} from tracking.`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

function pick(id) { selectedId = id; renderCards(); renderDetail(); }

function formatLastSynced(ts) {
  if (!ts) return 'Not synced yet';
  const now = Date.now();
  const diffMs = Math.max(0, now - ts);
  const diffMins = Math.floor(diffMs / 60000);

  if (diffMins < 15) {
    if (diffMins < 1) return 'Last synced just now';
    if (diffMins === 1) return 'Last synced 1 minute ago';
    return `Last synced ${diffMins} minutes ago`;
  }

  const d = new Date(ts);
  const timeStr = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
  const dateStr = d.toLocaleDateString([], { day: 'numeric', month: 'long', year: 'numeric' });
  return `Last synced: ${timeStr}, ${dateStr}`;
}

const TIPS = {
  promptCredits:  'Consumed each time you send a message or request a completion from the model.',
  flowCredits:    'Used up when the agent takes autonomous actions for you — like editing files or running commands.',
  maxInputTokens: 'The maximum amount of text (your message + code context) the model can receive in one request.',
  nextReset:      'The two pools reset independently — this shows whichever comes first.',
};

let countdownTickerInterval = null;

function stopCountdownTicker() {
  if (countdownTickerInterval) {
    clearInterval(countdownTickerInterval);
    countdownTickerInterval = null;
  }
}

function startCountdownTicker() {
  stopCountdownTicker();

  countdownTickerInterval = setInterval(() => {
    const now = Date.now();
    let updatedAny = false;

    ACCOUNTS.forEach(acc => {
      if (!acc.pools || acc.pools.length === 0) return;

      acc.pools.forEach((p, pi) => {
        const resetTimeMs = p.resetTime ? new Date(p.resetTime).getTime() : 0;

        if (resetTimeMs > 0 && now >= resetTimeMs) {
          p.remainingFraction = 1.0;
          p.resetIsEstimated = true;

          const label = getConstraintLabel(p.resetTime, p.resetIn);
          const windowDurationMs = (label === '5-Hour Limit') ? 5 * 3600 * 1000 : 7 * 86400 * 1000;
          p.resetTime = new Date(now + windowDurationMs).toISOString();
          updatedAny = true;
        }

        if (acc.id === selectedId) {
          const syncValEl = document.getElementById(`det-sync-val-${acc.id}`);
          if (syncValEl) {
            syncValEl.textContent = formatLastSynced(acc.lastSyncedAt || acc.lastSync);
          }
          const descEl = document.getElementById(`pool-desc-${acc.id}-${pi}`);
          const pctEl = document.getElementById(`pool-pct-num-${acc.id}-${pi}`);
          const ringEl = document.getElementById(`pool-ring-${acc.id}-${pi}`);

          if (descEl) {
            descEl.dataset.resetTimeMs = p.resetTime ? new Date(p.resetTime).getTime() : 0;
            const estSuffix = p.resetIsEstimated ? ' (Estimated)' : '';
            descEl.textContent = formatCompactResetSentence(p.resetTime, p.resetIn) + estSuffix;
          }
          if (p.remainingFraction === 1.0 && pctEl && ringEl) {
            const pst = status(100);
            pctEl.textContent = '100%';
            pctEl.style.color = MUTED[pst];
            ringEl.innerHTML = compactRing(100, pst);
          }
        }
      });

      // Update card-level compact countdown line
      const gEl = document.getElementById(`card-cd-gemini-${acc.id}`);
      const cEl = document.getElementById(`card-cd-claude-${acc.id}`);

      if (gEl || cEl) {
        const gPool = acc.pools.find(p => /gemini/i.test(p.name));
        const cPool = acc.pools.find(p => /claude|gpt/i.test(p.name));

        if (gEl && gPool) {
          const gTime = formatDurationCompact(gPool.resetTime, gPool.resetIn);
          const gEst = gPool.resetIsEstimated ? ' (Est)' : '';
          gEl.innerHTML = `<span class="cd-pool-name">Gemini</span> <span class="cd-time-val">${esc(gTime)}</span>${gEst}`;
        }
        if (cEl && cPool) {
          const cTime = formatDurationCompact(cPool.resetTime, cPool.resetIn);
          const cEst = cPool.resetIsEstimated ? ' (Est)' : '';
          cEl.innerHTML = `<span class="cd-pool-name">C+GPT</span> <span class="cd-time-val">${esc(cTime)}</span>${cEst}`;
        }
      }
    });
  }, 1000);
}

const tipEl = document.getElementById('tooltip');
function showTip(e) {
  const el = e.currentTarget;
  const tipKey = el.dataset.tip;
  const customTip = el.dataset.customTip;
  const tipText = customTip || TIPS[tipKey] || '';
  tipEl.textContent = tipText;
  tipEl.classList.add('visible');
  moveTip(e);
}
function hideTip()  { tipEl.classList.remove('visible'); }
function moveTip(e) {
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight, pad = 14;
  let x = e.clientX - tw / 2, y = e.clientY - th - pad;
  x = Math.max(6, Math.min(x, innerWidth  - tw - 6));
  y = y < 6 ? e.clientY + pad : y;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}

/* ═══════════════════════════════════════════════════════
   SYNC CLOCK
═══════════════════════════════════════════════════════ */
function timeSince(ts) {
  const from = ts === undefined ? lastSync : ts;
  const s = Math.round((Date.now() - from) / 1000);
  if (s < 5)    return 'just now';
  if (s < 60)   return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}
function tickSync() {
  const sub = document.getElementById('sync-subtitle');
  const det = document.getElementById('det-sync');
  const acc = ACCOUNTS.find(a => a.id === selectedId);
  if (sub) {
    const globalSource = (acc && acc.lastSyncSource === 'auto') ? 'Last auto-synced ' : 'Last synced ';
    sub.textContent = globalSource + timeSince(lastSync);
  }
  if (det && acc) {
    const prefix = (acc.lastSyncSource === 'auto') ? 'Last auto-synced ' : 'Last synced ';
    const wrap = document.getElementById(`sync-text-wrap-${acc.id}`);
    if (wrap) {
      const timeHtml = `<span class="sync-time" id="det-sync">${timeSince(acc.lastSync)}</span>`;
      const unreachHtml = acc.unreachable ? ` <span class="unreachable-note" style="font-size:11px; color:#71717a; margin-left:6px; font-style:italic;">(Showing last known data — account not currently running)</span>` : '';
      wrap.innerHTML = `${prefix}${timeHtml}${unreachHtml}`;
    } else {
      det.textContent = timeSince(acc.lastSync);
    }
  }
}

let isImportScanRunning = false;

async function runImportScan() {
  if (isImportScanRunning) return;
  if (!statusDiv) return;

  isImportScanRunning = true;
  statusDiv.style.display = 'block';
  statusDiv.style.background = 'rgba(129,140,248,0.08)';
  statusDiv.style.border = '1px solid rgba(129,140,248,0.25)';
  statusDiv.style.color = '#a5b4fc';
  statusDiv.innerHTML = '<span style="display:inline-flex;align-items:center;gap:8px;"><svg class="spinning-dot" style="width:12px;height:12px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Scanning for running Antigravity instance…</span>';

  try {
    const res = await window.api.detectRunningAccounts();
    if (!res.ok || !res.candidates || res.candidates.length === 0) {
      statusDiv.style.background = 'rgba(251,191,36,0.06)';
      statusDiv.style.border = '1px solid rgba(251,191,36,0.22)';
      statusDiv.style.color = '#e4e4e7';
      statusDiv.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:8px;">
          <div style="font-weight:600; font-size:13px; color:#fbbf24;">No Active Account Found</div>
          <div style="font-size:12px; color:#d4d4d8; line-height:1.5;">
            Lune only detects an <strong>active account</strong> that is currently signed in on a <strong>running Antigravity IDE instance</strong>.
          </div>
          <div style="font-size:11.5px; color:#a1a1aa; background:rgba(255,255,255,0.03); padding:10px 12px; border-radius:6px; border:1px solid #27272a; line-height:1.5;">
            💡 <strong>To import your account:</strong> Launch Antigravity IDE, ensure you are signed in, and click <strong>Scan Again</strong> below.
          </div>
          <button type="button" id="rescan-btn" onclick="runImportScan()" style="background:#27272a; color:#f4f4f5; border:1px solid #3f3f46; font-weight:600; font-size:11px; padding:7px 14px; border-radius:6px; cursor:pointer; align-self:flex-start; margin-top:4px;">
            Scan Again
          </button>
        </div>
      `;
      return;
    }

    const unregistered = res.candidates.filter(c => !c.isAlreadyRegistered);
    const alreadySaved = res.candidates.filter(c => c.isAlreadyRegistered);

    if (unregistered.length === 0) {
      statusDiv.style.background = 'rgba(251,191,36,0.08)';
      statusDiv.style.border = '1px solid rgba(251,191,36,0.25)';
      statusDiv.style.color = '#fbbf24';
      statusDiv.innerHTML = `
        <div style="margin-bottom:10px;">All detected active accounts (${esc(alreadySaved.map(c => c.email).join(', '))}) are already saved in Lune.</div>
        <button type="button" id="rescan-btn" onclick="runImportScan()" style="background:#27272a; color:#f4f4f5; border:1px solid #3f3f46; font-weight:600; font-size:11px; padding:6px 12px; border-radius:6px; cursor:pointer;">
          Scan Again
        </button>
      `;
      return;
    }

    statusDiv.style.background = 'rgba(129,140,248,0.06)';
    statusDiv.style.border = '1px solid rgba(129,140,248,0.2)';
    statusDiv.style.color = '#e4e4e7';
    statusDiv.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <span style="font-size:11px; color:#a1a1aa; font-weight:600; text-transform:uppercase; letter-spacing:0.05em;">Detected Active Account${unregistered.length > 1 ? 's' : ''}</span>
        <button type="button" id="rescan-btn" onclick="runImportScan()" style="background:transparent; color:#818cf8; border:none; font-size:11px; cursor:pointer; font-weight:500;">Refresh Scan</button>
      </div>
      ${unregistered.map((c, i) => `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; border-top:1px solid #27272a;">
          <div>
            <div style="font-size:13px; font-weight:600; color:#f4f4f5;">${esc(c.name || c.email)}</div>
            <div style="font-size:11px; color:#71717a;">${esc(c.email)}</div>
          </div>
          <button type="button" id="confirm-import-${i}"
            style="background:#818cf8; color:#09090b; border:none; font-weight:600; font-size:11px; padding:6px 14px; border-radius:6px; cursor:pointer; flex-shrink:0; transition:background .15s;">
            Import Account
          </button>
        </div>
      `).join('')}
    `;

    unregistered.forEach((c, i) => {
      document.getElementById(`confirm-import-${i}`)?.addEventListener('click', async () => {
        const saveRes = await window.api.saveImportedAccount(c.accountObj);
        if (saveRes.ok && saveRes.account) {
          const existingIdx = ACCOUNTS.findIndex(a =>
            a.id === saveRes.account.id ||
            (a.email && a.email.toLowerCase() === (saveRes.account.email || '').toLowerCase())
          );
          if (existingIdx !== -1) {
            ACCOUNTS[existingIdx] = saveRes.account;
          } else {
            ACCOUNTS.push(saveRes.account);
          }
          selectedAccountId = saveRes.account.id;
          closeAddModal();
          renderCards();
          renderDetail();

          const toast = document.createElement('div');
          toast.style.cssText = `position:fixed;bottom:24px;right:24px;z-index:9999;background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.35);color:#4ade80;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 4px 24px rgba(0,0,0,0.4);pointer-events:none;animation:fadeIn 0.2s ease;`;
          toast.textContent = `✓ Imported ${saveRes.account.email} — tracking quota automatically.`;
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 4000);
        } else {
          statusDiv.style.color = '#f87171';
          statusDiv.innerHTML = (saveRes.error === 'duplicate-account') ? `Account '${c.email}' is already saved in Lune.` : `Import failed: ${saveRes.message || saveRes.error || 'Unknown error'}`;
        }
      });
    });
  } catch (err) {
    statusDiv.style.background = 'rgba(248,113,113,0.08)';
    statusDiv.style.border = '1px solid rgba(248,113,113,0.25)';
    statusDiv.style.color = '#f87171';
    statusDiv.innerHTML = 'Scan failed: ' + esc(err.message || 'Unknown error');
  } finally {
    isImportScanRunning = false;
  }
}


/* ═══════════════════════════════════════════════════════
   INIT — Load accounts from disk (userData/accounts.json)
═══════════════════════════════════════════════════════ */
async function initAccounts() {
  if (typeof window.api !== 'undefined' && typeof window.api.loadAccounts === 'function') {
    try {
      const persisted = await window.api.loadAccounts();
      if (Array.isArray(persisted) && persisted.length > 0) {
        ACCOUNTS.length = 0;
        persisted.forEach(acc => {
          if (!acc.profilePath && acc.userDataDir) acc.profilePath = acc.userDataDir;
          if (!acc.userDataDir && acc.profilePath) acc.userDataDir = acc.profilePath;
          ACCOUNTS.push(acc);
        });
        console.log('[Lune] Loaded from accounts.json:', ACCOUNTS.length, 'account(s)');
      }
    } catch (err) {
      console.warn('[Lune] Could not load accounts.json:', err);
    }
  }
  if (typeof window.api?.onLiveAccountUpdate === 'function') {
    window.api.onLiveAccountUpdate(payload => {
      // Part 9 (renderer guard): Only apply if this is a genuine successful match+query.
      // A real live-account-update must have ok:true AND a confirmed email.
      // Wrong-account-active and unreachable cases are allowed through so their status flags apply,
      // but if neither ok nor a recognised status/error field is set, discard entirely.
      const isGenuineSuccess = payload.ok === true && payload.email;
      const isWrongAccount = payload.status === 'wrong-account-active' || payload.error === 'wrong-account-active';
      const isUnreachable = payload.unreachable || payload.status === 'unreachable';
      if (!isGenuineSuccess && !isWrongAccount && !isUnreachable) {
        console.info('[Lune renderer] Discarding live-account-update for', payload.accountId, '— not a genuine success and no recognised status flag.');
        return;
      }
      const acc = ACCOUNTS.find(a => a.id === payload.accountId);
      if (acc) {
        applyRefreshResultToAccount(acc, payload);
        renderCards();
        if (selectedId === acc.id) renderDetail();
      }
    });
  }

  if (typeof window.api?.onRefreshAllCardStatus === 'function') {
    window.api.onRefreshAllCardStatus(({ accountId, status }) => {
      const card = document.getElementById(`card-${accountId}`);
      if (card) {
        if (status === 'start') card.classList.add('card-refreshing');
        else card.classList.remove('card-refreshing');
      }
    });
  }

  // Part 10: Wire live online/offline indicator per account card with auto-sorting.
  if (typeof window.api?.onAccountOnlineStatusSync === 'function') {
    window.api.onAccountOnlineStatusSync(({ activeAccountIds }) => {
      const activeIdsSet = new Set(activeAccountIds || []);

      // Check if state actually changed before re-rendering DOM
      let stateChanged = activeIdsSet.size !== onlineAccountIds.size;
      if (!stateChanged) {
        for (const id of activeIdsSet) {
          if (!onlineAccountIds.has(id)) {
            stateChanged = true;
            break;
          }
        }
      }

      if (!stateChanged) return; // Skip DOM re-render if nothing changed!

      // Full state cleanup on change
      onlineAccountIds.clear();

      ACCOUNTS.forEach(acc => {
        const isAccActive = activeIdsSet.has(acc.id);
        acc.isLive = isAccActive;

        if (isAccActive) {
          onlineAccountIds.add(acc.id);
        } else {
          if (acc.status === 'active') {
            acc.status = 'inactive';
          }
        }
      });

      renderCards();
      if (selectedId) renderDetail();
    });
  }

  if (typeof window.api?.onAccountOnlineStatus === 'function') {
    window.api.onAccountOnlineStatus(({ accountId, isOnline }) => {
      const acc = ACCOUNTS.find(a => a.id === accountId);
      if (acc) acc.isLive = isOnline;
      if (isOnline) {
        onlineAccountIds.add(accountId);
      } else {
        onlineAccountIds.delete(accountId);
      }
      renderCards();
      if (selectedId === accountId) renderDetail();
    });
  }

  if (ACCOUNTS.length > 0) {
    selectedId = ACCOUNTS[0].id;
  } else {
    selectedId = null;
  }
  renderCards();
  renderDetail();
}

initAccounts();

  btnAccounts?.addEventListener('click', () => setView(btnAccounts, 'accounts'));
  btnAnalytics?.addEventListener('click', () => setView(btnAnalytics, 'analytics'));
