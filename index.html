<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lune — AI Quota Dashboard</title>
<meta name="description" content="Monitor AI usage quota across multiple IDE accounts in a unified local dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>

/* ═══════════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
button { font-family: inherit; cursor: pointer; }

body {
  font-family: 'Inter', sans-serif;
  background: #09090b;
  color: #e4e4e7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-width: 900px;
}

/* ═══════════════════════════════════════════════════════
   APP LAYOUT — 3-COLUMN GRID
═══════════════════════════════════════════════════════ */
.app {
  display: grid;
  grid-template-columns: 64px 430px 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ═══════════════════════════════════════════════════════
   LEFT RAIL / SIDEBAR
═══════════════════════════════════════════════════════ */
.sidebar {
  background: #18181b;
  border-right: 1px solid #27272a;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0;
  z-index: 10;
}

.sidebar-logo {
  width: 36px;
  height: 36px;
  background: #27272a;
  border: 1px solid #3f3f46;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  flex-shrink: 0;
  transition: background .15s, border-color .15s;
}
.sidebar-logo:hover { background: #3f3f46; border-color: #71717a; }

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  width: 100%;
  padding: 0 8px;
  align-items: center;
}

/* ── TEMP: IPC bridge test button (remove in next phase) ── */
#ipc-test-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: rgba(129, 140, 248,.10);
  color: #818cf8;
  font-size: 16px;
  cursor: pointer;
  transition: background .15s, transform .1s;
  position: relative;
}
#ipc-test-btn:hover { background: rgba(129, 140, 248,.22); transform: translateY(-1px); }
#ipc-test-btn:active { transform: translateY(0); }
#ipc-test-btn[title]::after {
  content: attr(title);
  position: absolute;
  left: 52px; top: 50%;
  transform: translateY(-50%);
  background: #27272a;
  color: #e4e4e7;
  font-size: 11px;
  white-space: nowrap;
  padding: 3px 8px;
  border-radius: 5px;
  border: 1px solid #27272a;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s;
}
#ipc-test-btn:hover::after { opacity: 1; }
/* ──────────────────────────────────────────────── */

.sidebar-bottom {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  padding: 10px 8px 0;
  align-items: center;
  border-top: 1px solid #27272a;
  margin-top: 10px;
}

.nav-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #71717a;
  border: none;
  background: transparent;
  transition: background .15s, color .15s, transform .1s;
  position: relative;
}
.nav-btn:hover { background: #27272a; color: #a1a1aa; transform: translateY(-1px); }
.nav-btn.active { background: rgba(129, 140, 248,.12); color: #818cf8; }
.nav-btn.active::before {
  content: '';
  position: absolute;
  left: -8px; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 20px;
  background: #818cf8;
  border-radius: 0 3px 3px 0;
}

/* ═══════════════════════════════════════════════════════
   SHARED PANEL HEADER — exactly 84px tall
═══════════════════════════════════════════════════════ */
.panel-header {
  height: 84px;
  min-height: 84px;
  max-height: 84px;
  border-bottom: 1px solid #27272a;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 20px;
  flex-shrink: 0;
  background: #18181b;
}

/* ═══════════════════════════════════════════════════════
   MIDDLE COLUMN — ACCOUNTS LIST
═══════════════════════════════════════════════════════ */
.accounts-panel {
  border-right: 1px solid #27272a;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.panel-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: #e4e4e7;
  letter-spacing: -.01em;
}

.panel-subtitle {
  font-size: 11.5px;
  color: #71717a;
  margin-top: 4px;
}

.refresh-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #27272a;
  border: 1px solid #27272a;
  color: #a1a1aa;
  font-size: 11.5px;
  font-weight: 500;
  padding: 5px 11px;
  border-radius: 8px;
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.refresh-btn:hover { background: #27272a; color: #e4e4e7; border-color: #3f3f46; }
.refresh-icon { transition: transform .55s cubic-bezier(.4,0,.2,1); }
.refresh-btn.spinning .refresh-icon { transform: rotate(360deg); }

.add-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(129, 140, 248,.12);
  border: 1px solid rgba(129, 140, 248,.28);
  color: #818cf8;
  font-size: 11.5px;
  font-weight: 600;
  padding: 5px 11px;
  border-radius: 8px;
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.add-btn:hover { background: rgba(129, 140, 248,.22); border-color: rgba(129, 140, 248,.45); }

.unsynced-label {
  font-size: 10.5px;
  color: #71717a;
  font-style: italic;
}

.accounts-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}
.accounts-list::-webkit-scrollbar { width: 4px; }
.accounts-list::-webkit-scrollbar-track { background: transparent; }
.accounts-list::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }

/* ═══════════════════════════════════════════════════════
   ACCOUNT CARDS
═══════════════════════════════════════════════════════ */
.account-card {
  background: #18181b;
  border: 1px solid #27272a;
  border-left: 3px solid transparent;
  border-radius: 10px;
  padding: 12px 12px 10px;
  margin-bottom: 7px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 9px;
  transition: background .12s, border-color .12s, transform .1s;
  user-select: none;
  outline: none;
}
.account-card:hover  { background: #27272a; transform: translateX(1px); }
.account-card:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }
.account-card:active { transform: translateX(0); }

.account-card.selected             { background: rgba(129, 140, 248,.05); border-left-color: #818cf8; }
.account-card.selected.status-warn { background: rgba(251, 191, 36,.05); border-left-color: #fbbf24; }
.account-card.selected.status-crit { background: rgba(248, 113, 113,.05); border-left-color: #f87171; }

.card-top-row { display: flex; align-items: center; gap: 9px; }

.card-rank {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #71717a;
  width: 14px;
  flex-shrink: 0;
  text-align: center;
}

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px;
  font-weight: 700;
  color: rgba(255,255,255,.88);
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,.08);
}

.card-info { flex: 1; min-width: 0; }
.card-name  { font-size: 12.5px; font-weight: 600; color: #e4e4e7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-email { font-size: 11px; color: #71717a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

.launch-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  background: transparent;
  border: 1px solid #27272a;
  color: #71717a;
  font-size: 10.5px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 6px;
  transition: all .15s;
  flex-shrink: 0;
  white-space: nowrap;
}
.launch-btn:hover { background: #27272a; color: #a1a1aa; border-color: #3f3f46; }

.card-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.remove-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  background: transparent;
  border: 1px solid #27272a;
  color: #71717a;
  border-radius: 6px;
  transition: all .15s;
  flex-shrink: 0;
  cursor: pointer;
}
.remove-btn:hover {
  background: rgba(248, 113, 113, .12);
  color: #f87171;
  border-color: rgba(248, 113, 113, .3);
}

.card-quota-row { display: flex; align-items: center; gap: 9px; padding-left: 23px; }

.quota-bar-wrap {
  flex: 1;
  height: 4px;
  background: #27272a;
  border-radius: 99px;
  overflow: visible;
}
.quota-bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width .6s cubic-bezier(.4,0,.2,1);
}
/* Vivid traffic-light colors — these list bars are the "at a glance" signal */
.quota-bar-fill.healthy  { background: #34d399; }
.quota-bar-fill.warn     { background: #fbbf24; }
.quota-bar-fill.critical { background: #f87171; }

.quota-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: #a1a1aa;
  min-width: 30px;
  text-align: right;
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════════════════
   RIGHT — DETAIL PANEL
═══════════════════════════════════════════════════════ */
.detail-panel { display: flex; flex-direction: column; overflow: hidden; background: #09090b; }

.detail-panel .panel-header {
  flex-direction: row;
  align-items: center;
  gap: 12px;
  padding: 0 22px;
}

.detail-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: rgba(255,255,255,.88);
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,.1);
}

.detail-name-wrap { flex: 1; min-width: 0; }
.detail-name  { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; color: #e4e4e7; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.detail-email { font-size: 11.5px; color: #71717a; margin-top: 2px; }

.plan-badge {
  font-size: 10.5px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 99px;
  white-space: nowrap;
  border: 1px solid;
  flex-shrink: 0;
  letter-spacing: .01em;
}
.plan-badge.healthy  { background: rgba(129, 140, 248,.10); color: #818cf8; border-color: rgba(129, 140, 248,.28); }
.plan-badge.warn     { background: rgba(251, 191, 36,.10); color: #fbbf24; border-color: rgba(251, 191, 36,.28); }
.plan-badge.critical { background: rgba(248, 113, 113,.10); color: #f87171; border-color: rgba(248, 113, 113,.28); }

.launch-main-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  border: 1px solid rgba(129, 140, 248,.28);
  color: #818cf8;
  background: rgba(129, 140, 248,.08);
  font-size: 12.5px;
  font-weight: 600;
  padding: 7px 16px;
  border-radius: 8px;
  transition: all .18s;
  white-space: nowrap;
  flex-shrink: 0;
}
.launch-main-btn:hover {
  background: rgba(129, 140, 248,.15);
  border-color: rgba(129, 140, 248,.45);
  box-shadow: 0 0 18px rgba(129, 140, 248,.12);
  transform: translateY(-1px);
}
.launch-main-btn:active { transform: translateY(0); }

/* ─── Detail scrollable content ─── */
.detail-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 22px 16px;
}
.detail-content::-webkit-scrollbar { width: 4px; }
.detail-content::-webkit-scrollbar-track { background: transparent; }
.detail-content::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }

.section-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: #3f3f46;
  margin-bottom: 10px;
}

/* ═══════════════════════════════════════════════════════
   QUOTA POOL CARDS
═══════════════════════════════════════════════════════ */
.pools-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.pool-column {
  display: flex;
  flex-direction: column;
}

.pool-card {
  background: #18181b;
  border: 1px solid #27272a;
  border-radius: 12px;
  padding: 16px 18px 14px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  transition: border-radius .2s, border-color .15s, background .15s;
  cursor: pointer;
  user-select: none;
}
.pool-card:hover { background: #27272a; border-color: #3f3f46; }
.pool-column.expanded .pool-card {
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
  border-color: #3f3f46;
  background: #18181b;
}

.pool-card-header {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.pool-card-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.pool-card-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: #f4f4f5;
}
.pool-info-icon {
  width: 14px;
  height: 14px;
  color: #71717a;
  flex-shrink: 0;
  cursor: help;
}
.pool-card-subtitle {
  font-size: 11px;
  font-weight: 500;
  color: #a1a1aa;
}
.pool-card-desc {
  font-size: 11.5px;
  color: #71717a;
  line-height: 1.45;
}
.pool-card-body {
  margin-top: 2px;
  margin-bottom: 2px;
}
.pool-pct-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.pool-pct-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 26px;
  font-weight: 700;
  line-height: 1;
}
.compact-ring-svg {
  flex-shrink: 0;
}
.pool-card-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  color: #71717a;
  font-size: 10.5px;
}
.pool-details-label {
  font-size: 10.5px;
  color: #71717a;
}

/* Pool expand chevron */
.pool-chevron {
  width: 14px; height: 14px;
  color: #71717a;
  transition: transform .25s cubic-bezier(.4,0,.2,1), color .15s;
  flex-shrink: 0;
}
.pool-column.expanded .pool-chevron { transform: rotate(180deg); color: #818cf8; }

/* Expandable stats panel beneath a pool card — height set inline via JS (scrollHeight)
   so it fits real content instead of a guessed fixed max-height */
.pool-stats-panel {
  background: #18181b;
  border: 1px solid #3f3f46;
  border-top: none;
  border-radius: 0 0 12px 12px;
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  padding: 0 14px;
  transition: max-height .32s cubic-bezier(.4,0,.2,1), opacity .25s ease, padding .32s cubic-bezier(.4,0,.2,1);
}
.pool-column.expanded .pool-stats-panel {
  opacity: 1;
  padding: 12px 14px 14px;
}

.pool-unit-breakdown {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.pool-unit-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
}
.pool-unit-main {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.pool-unit-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 700;
  line-height: 1;
}
.pool-unit-fraction {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: #3f3f46;
}
.pool-unit-label {
  font-size: 10.5px;
  color: #a1a1aa;
  font-weight: 500;
}
.pool-unit-consumed {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: #71717a;
}
.pool-bar-wrap { height: 4px; background: #27272a; border-radius: 99px; overflow: hidden; }
.pool-bar-fill { height: 100%; border-radius: 99px; transition: width .5s cubic-bezier(.4,0,.2,1); }
.pool-bar-fill.healthy  { background: #818cf8; }
.pool-bar-fill.warn     { background: #fbbf24; }
.pool-bar-fill.critical { background: #f87171; }

/* Per-model breakdown list inside the expanded panel */
.model-breakdown {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding-top: 2px;
  border-top: 1px solid #27272a;
}
.model-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.model-row-name {
  font-size: 10.5px;
  color: #a1a1aa;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.model-tag {
  font-size: 8.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .04em;
  padding: 1.5px 5px;
  border-radius: 4px;
  background: rgba(129, 140, 248,.12);
  color: #818cf8;
  border: 1px solid rgba(129, 140, 248,.25);
  flex-shrink: 0;
}
.model-tag.fast {
  background: rgba(167, 139, 250,.12);
  color: #a78bfa;
  border-color: rgba(167, 139, 250,.25);
}
.model-row-frac {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: #71717a;
  flex-shrink: 0;
  width: 40px;
  text-align: right;
}

.ring-container { position: relative; width: 90px; height: 90px; flex-shrink: 0; }
.ring-container svg { position: absolute; inset: 0; overflow: visible; }
.ring-label {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1px;
}
.ring-pct { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 600; line-height: 1; }
.ring-sublabel { font-size: 9px; color: #71717a; text-transform: uppercase; letter-spacing: .06em; }

.pool-info { text-align: center; width: 100%; }
.pool-name { font-family: 'Space Grotesk', sans-serif; font-size: 12.5px; font-weight: 700; color: #e4e4e7; margin-bottom: 5px; }
.pool-models { font-size: 10.5px; color: #71717a; line-height: 1.65; margin-bottom: 7px; }
.pool-reset { font-size: 10.5px; color: #71717a; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; }
.pool-reset-val { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #a1a1aa; }

/* ═══════════════════════════════════════════════════════
   STAT GRID (4 columns)
═══════════════════════════════════════════════════════ */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 16px; }

.stat-card {
  background: #18181b;
  border: 1px solid #27272a;
  border-radius: 10px;
  padding: 13px 12px 11px;
  transition: border-color .15s, background .15s;
}
.stat-card:hover { background: #27272a; }

.stat-label {
  font-size: 10.5px;
  color: #71717a;
  margin-bottom: 9px;
  display: inline-block;
  line-height: 1.3;
}
.stat-label.has-tooltip {
  border-bottom: 1px dashed #3f3f46;
  cursor: help;
  transition: border-color .15s, color .15s;
}
.stat-label.has-tooltip:hover { border-bottom-color: #71717a; color: #a1a1aa; }

.stat-value { font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 600; color: #e4e4e7; line-height: 1; display: block; }
.stat-sub { font-size: 10px; color: #71717a; margin-top: 5px; }

/* ═══════════════════════════════════════════════════════
   SYNC ROW
═══════════════════════════════════════════════════════ */
.sync-row { display: flex; align-items: center; gap: 8px; padding-top: 14px; border-top: 1px solid #27272a; }
.sync-text { font-size: 11.5px; color: #71717a; flex: 1; }
.sync-time { font-family: 'JetBrains Mono', monospace; color: #a1a1aa; }

.refresh-acc-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: 1px solid #27272a;

function deriveInitials(name) {
  if (!name) return '??';

function status(pct) { return pct >= 85 ? 'healthy' : pct >= 15 ? 'warn' : 'critical'; }
const MUTED = { healthy: '#818cf8', warn: '#fbbf24', critical: '#f87171' };

function formatResetTimeSentence(rt) {
  if (!rt) return 'a few days';
  try {
    let diffMs = 0;
    const d = new Date(rt);
    if (!isNaN(d.getTime())) {
      diffMs = Math.max(0, d.getTime() - Date.now());
    } else if (typeof rt === 'string') {
      const dMatch = rt.match(/(\d+)d/);
      const hMatch = rt.match(/(\d+)h/);
      if (dMatch || hMatch) {
        const days = dMatch ? parseInt(dMatch[1], 10) : 0;
        const hours = hMatch ? parseInt(hMatch[1], 10) : 0;
        diffMs = (days * 86400 + hours * 3600) * 1000;
      }
    }

    if (diffMs <= 0) return '0 days, 0 hours';
    const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
    const diffDays = Math.floor(diffHrs / 24);
    const remHrs = diffHrs % 24;

    const dayStr = `${diffDays} day${diffDays !== 1 ? 's' : ''}`;
    const hrStr = `${remHrs} hour${remHrs !== 1 ? 's' : ''}`;
    return `${dayStr}, ${hrStr}`;
  } catch (e) {
    return '6 days, 18 hours';
  }
}

function compactRing(pct, st) {
  const r = 11;
  const circ = 2 * Math.PI * r;
  const safePct = Math.min(100, Math.max(0, pct));
  const arc = +(circ * safePct / 100).toFixed(2);
  const gap = +(circ - arc).toFixed(2);
  const col = MUTED[st];
  return `
    <svg class="compact-ring-svg" viewBox="0 0 28 28" width="22" height="22" aria-hidden="true" style="overflow:visible">
      <circle cx="14" cy="14" r="${r}" fill="none" stroke="#27272a" stroke-width="3.5"/>
      <circle cx="14" cy="14" r="${r}" fill="none"
        stroke="${col}" stroke-width="3.5"
        stroke-dasharray="${arc} ${gap}" stroke-linecap="round"
        transform="rotate(-90 14 14)"/>

  let hasResetDiscrepancy = false;

  for (let i = 0; i < models.length; i++) {
    if (Math.abs((models[i].fraction ?? 0) - (rep.fraction ?? 0)) > 0.0001) {
      hasFracDiscrepancy = true;
    }
    if (models[i].resetTime !== rep.resetTime) {
      hasResetDiscrepancy = true;
    }
  }

  const hasDiscrepancy = hasFracDiscrepancy || hasResetDiscrepancy;
  let discrepancyDetails = null;
  if (hasDiscrepancy) {
    discrepancyDetails = models.map(m => `${m.name}: frac=${m.fraction}, reset=${m.resetTime}`).join('; ');
    console.warn(`[Lune] Model quota variance in ${poolName} (primary: ${rep.name}):`, discrepancyDetails);
  }

  return {
    name: poolName,
    remainingFraction: rep.fraction ?? 1.0,
    resetTime: rep.resetTime || null,
    resetIn: formatResetTime(rep.resetTime),
    primaryModelName: rep.name,
    fiveHourRemainingFraction: rep.fiveHourRemainingFraction ?? null,
    fiveHourResetTime: rep.fiveHourResetTime || null,
    fiveHourResetIn: formatResetTime(rep.fiveHourResetTime),
    models: models,
    hasDiscrepancy,
    discrepancyDetails
  };
}

function getClockTime(str) {
  if (!str) return '';
  const dMatch = str.match(/(\d+)d/);
  const hMatch = str.match(/(\d+)h/);
  const days = dMatch ? parseInt(dMatch[1], 10) : 0;
  const hours = hMatch ? parseInt(hMatch[1], 10) : 0;
  const target = new Date(Date.now() + (days * 86400 + hours * 3600) * 1000);
  const month = target.toLocaleDateString('en-US', { month: 'short' });
  const day = target.getDate();
  const timeStr = target.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  return `${month} ${day}, ${timeStr}`;
}

function formatResetTime(rt) {
  if (!rt) return 'N/A';
  try {
    const d = new Date(rt);
    if (isNaN(d.getTime())) return String(rt);
    const diffMs = d.getTime() - Date.now();
    if (diffMs <= 0) return 'Resetting...';
    const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
    const diffDays = Math.floor(diffHrs / 24);
    const remHrs = diffHrs % 24;
    if (diffDays > 0) return `${diffDays}d ${remHrs}h`;
    return `${diffHrs}h`;
  } catch (e) {
    return String(rt);
  }
}

  if (typeof window.api === 'undefined' || typeof window.api.refreshAccount !== 'function') {

      acc.authenticated = true;
      acc.refreshError = result.error;
    } else if (result.ok) {

      acc.refreshError = null;

      // Preserve snapshot for pool delta computations
      if ((acc.pools && acc.pools.length > 0) || acc.stats) {
        acc.previousSnapshot = {
          pools: acc.pools ? acc.pools.map(p => ({
            name: p.name,
            remainingFraction: p.remainingFraction,
            resetIn: p.resetIn
          })) : [],
          promptCredits: acc.stats?.promptCredits ? acc.stats.promptCredits.rem : 0,
          flowCredits: acc.stats?.flowCredits ? acc.stats.flowCredits.rem : 0,
          capturedAt: acc.lastSync || Date.now()
        };
      }

      acc.lastSync = Date.now();

      if (result.name) {
        acc.name = result.name;
        acc.initials = deriveInitials(result.name);
      }
      if (result.email) {
        acc.email = result.email;
      }

      acc.planName = result.planName || null;
      acc.teamsTier = result.teamsTier || null;
      acc.userTierName = result.userTierName || null;

      acc.plan = result.userTierName || result.planName || result.teamsTier || (acc.plan || 'Google AI Pro');

      acc.promptCredits = result.promptCredits || null;
      acc.flowCredits = result.flowCredits || null;
      acc.modelQuotas = result.modelQuotas || [];

      // Extract real maxNumChatInputTokens from raw body
      let maxTokens = 16384;
      if (result.body || result.raw) {
        try {
          const parsedBody = JSON.parse(result.body || result.raw);
          const rawTokens = parsedBody.userStatus?.planStatus?.planInfo?.maxNumChatInputTokens;
          if (rawTokens) maxTokens = parseInt(rawTokens, 10) || 16384;
        } catch (e) {}
      }

      // Find earliest resetTime among modelQuotas
      let earliestReset = null;
      let earliestResetMs = Infinity;
      if (Array.isArray(acc.modelQuotas) && acc.modelQuotas.length > 0) {
        acc.modelQuotas.forEach(m => {
          if (m.resetTime) {
            const ms = new Date(m.resetTime).getTime();
            if (!isNaN(ms) && ms < earliestResetMs) {
              earliestResetMs = ms;
              earliestReset = m.resetTime;
            }
          }
        });
      }
      const resetInFormatted = earliestReset ? formatResetTime(earliestReset) : (acc.modelQuotas[0]?.resetTime ? formatResetTime(acc.modelQuotas[0].resetTime) : 'N/A');

      const promptAvail = acc.promptCredits?.available ?? 0;
      const promptMonthly = acc.promptCredits?.monthly ?? 1;
      const promptFrac = promptMonthly > 0 ? promptAvail / promptMonthly : 0;

      const flowAvail = acc.flowCredits?.available ?? 0;
      const flowMonthly = acc.flowCredits?.monthly ?? 1;
      const flowFrac = flowMonthly > 0 ? flowAvail / flowMonthly : 0;

      acc.hasQuotaData = true;

      acc.stats = {
        promptCredits: { rem: promptAvail, tot: promptMonthly },
        flowCredits: { rem: flowAvail, tot: flowMonthly },
        maxInputTokens: maxTokens,
        nextReset: resetInFormatted
      };

      const geminiModels = [];
      const claudeGptModels = [];

      (acc.modelQuotas || []).forEach(m => {
        const label = m.label || m.name || 'Unknown Model';
        const item = {
          name: label,
          tag: m.tagTitle || (m.remainingFraction !== null && m.remainingFraction > 0.8 ? 'FAST' : null),
          fraction: m.remainingFraction ?? 0,
          resetTime: m.resetTime,
          fiveHourRemainingFraction: m.fiveHourRemainingFraction ?? null,
          fiveHourResetTime: m.fiveHourResetTime || null,
        };
        if (/gemini/i.test(label)) {
          geminiModels.push(item);
        } else if (/claude|gpt/i.test(label)) {
          claudeGptModels.push(item);
        } else {
          claudeGptModels.push(item);
        }
      });

      acc.pools = [
        buildPoolFromGroup('Gemini Models', geminiModels),
        buildPoolFromGroup('Claude and GPT models', claudeGptModels)
      ];

      const maxFrac = acc.pools.length > 0 ? Math.max(...acc.pools.map(p => p.remainingFraction)) : 1.0;
      acc.quotaPercent = Math.round(maxFrac * 100);

      console.info('[Lune] Model grouping summary for real account:', {
        gemini: geminiModels.map(m => m.name),
        claudeGpt: claudeGptModels.map(m => m.name),
        pools: acc.pools
      });
    }
  } catch (err) {
    console.error('[Lune] Real refresh call threw exception:', err);
    acc.refreshStatusLabel = '';
    acc.refreshError = err.message || 'Refresh failed';
  } finally {
    unsub();
    renderCards();
    if (selectedId === acc.id) renderDetail();
  }
}

/* Mock refresh helper for secondary accounts — nudges numbers and records previousSnapshot for diffing */
function mockRefreshAccountObj(acc) {
  if (!acc) return;
  // If account has existing pools & stats, snapshot them before updating
  if (acc.pools && acc.pools.length > 0 && acc.stats) {
    acc.previousSnapshot = {
      pools: acc.pools.map(p => ({
        name: p.name,
        remainingFraction: p.remainingFraction,
        resetIn: p.resetIn
      })),
      promptCredits: acc.stats.promptCredits ? acc.stats.promptCredits.rem : 0,
      flowCredits: acc.stats.flowCredits ? acc.stats.flowCredits.rem : 0,
      capturedAt: acc.lastSync || Date.now()
    };
  }

  // If brand-new unlinked account being synced for first time:
  if (!acc.pools || acc.pools.length === 0) {
    acc.plan = 'Google AI Pro';
    acc.pools = [
      { name: 'Gemini Models', remainingFraction: 0.9500, resetTime: '2026-08-11T12:00:00Z', resetIn: '14d 6h',
        models: [
          { name: 'Gemini 2.0 Flash', tag: 'fast', fraction: 0.9650 },
          { name: 'Gemini 1.5 Pro', tag: null, fraction: 0.9350 },
          { name: 'Gemini 2.0 Pro', tag: 'recommended', fraction: 0.9500 },
        ] },

        models: [
          { name: 'Claude 3.5 Sonnet', tag: 'recommended', fraction: 0.9150 },
          { name: 'GPT-4o', tag: null, fraction: 0.8850 },
          { name: 'Claude 3 Opus', tag: null, fraction: 0.8750 },
        ] },
    ];
    acc.stats = {
      promptCredits: { rem: 4750, tot: 5000 },
      flowCredits: { rem: 450, tot: 500 },
      maxInputTokens: 128000,
      nextReset: '14d 6h'
    };
    acc.quotaPercent = 95;
    acc.lastSync = Date.now();
    return;
  }

  // Update existing pool & stat values with small realistic deltas
  const isReset = Math.random() < 0.25; // 25% chance of quota reset to test new cycle logic

  acc.pools.forEach(p => {
    if (isReset) {
      // Advance resetIn to simulate a new cycle starting
      const resetCycle = ['14d 6h', '14d 12h', '15d 0h', '14d 18h'];
      const nextIdx = (resetCycle.indexOf(p.resetIn) + 1) % resetCycle.length;
      p.resetIn = resetCycle[nextIdx === -1 ? 0 : nextIdx];
      p.remainingFraction = 1.0000;
      p.models.forEach(m => m.fraction = 1.0000);
    } else {
      // Normal usage case: keep resetIn SAME as before, decrease fraction
      const drop = +(Math.random() * 0.035 + 0.005).toFixed(4); // 0.5% to 4.0% drop
      p.remainingFraction = Math.max(0.0100, +(p.remainingFraction - drop).toFixed(4));
      p.models.forEach(m => {
        m.fraction = Math.max(0.0100, +(m.fraction - drop * (0.8 + Math.random() * 0.4)).toFixed(4));
      });
    }
  });

  if (isReset) {
    acc.stats.nextReset = acc.pools[0].resetIn;
    acc.stats.promptCredits.rem = acc.stats.promptCredits.tot;
    acc.stats.flowCredits.rem = acc.stats.flowCredits.tot;
  } else {
    const promptDrop = Math.floor(Math.random() * 180 + 20);
    const flowDrop = Math.floor(Math.random() * 20 + 2);
    acc.stats.promptCredits.rem = Math.max(0, acc.stats.promptCredits.rem - promptDrop);
    acc.stats.flowCredits.rem = Math.max(0, acc.stats.flowCredits.rem - flowDrop);
  }

  const maxFrac = Math.max(...acc.pools.map(p => p.remainingFraction));
  acc.quotaPercent = Math.round(maxFrac * 100);
  acc.lastSync = Date.now();
}

function getPoolDeltaInfo(acc, pool) {
  if (!acc.previousSnapshot || !acc.previousSnapshot.pools) return null;
  const prevP = acc.previousSnapshot.pools.find(x => x.name === pool.name);
  if (!prevP) return null;

  // Key off resetTime (resetIn) equality first
  if (pool.resetIn !== prevP.resetIn) {
    return { text: '▲ Quota reset — new cycle', cls: 'up' };
  }

  // Same cycle: compare remainingFraction
  const deltaFrac = pool.remainingFraction - prevP.remainingFraction;
  const deltaPct = Math.abs(deltaFrac * 100);

  if (deltaFrac < -0.001) {
    return { text: `▼ ${deltaPct.toFixed(1)}% used`, cls: 'down' };
  } else {
    return { text: 'No change since last sync', cls: 'same' };
  }
}

function getSyncDeltaSummary(acc) {
  if (!acc.previousSnapshot) return '';
  const prevPrompts = acc.previousSnapshot.promptCredits;
  const currPrompts = acc.stats ? acc.stats.promptCredits.rem : 0;
  const usedPrompts = prevPrompts - currPrompts;

  if (usedPrompts > 0) {
    return `used ${fmt(usedPrompts)} prompt credits since then`;
  } else if (usedPrompts < 0) {
    return `Quota reset — new cycle`;
  } else {
    return `No change since last sync`;
  }
}

/* ═══════════════════════════════════════════════════════

═══════════════════════════════════════════════════════ */
function ring(pct, st) {
  const r    = 37;
  const circ = 2 * Math.PI * r;
  const arc  = +(circ * pct / 100).toFixed(3);
  const gap  = +(circ - arc).toFixed(3);
  const col  = MUTED[st];
  const uid  = 'f' + Math.random().toString(36).slice(2, 8);
  return `
    <svg viewBox="0 0 100 100" width="90" height="90" style="overflow:visible" aria-hidden="true">
      <defs>
        <filter id="${uid}" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="#27272a" stroke-width="9"/>
      <circle cx="50" cy="50" r="${r}" fill="none"
        stroke="${col}" stroke-width="8"
        stroke-dasharray="${arc} ${gap}" stroke-linecap="round"
        transform="rotate(-90, 50, 50)" filter="url(#${uid})"/>
    </svg>
    <div class="ring-label">
      <span class="ring-pct" style="color:${col}">${pct}%</span>
      <span class="ring-sublabel">left</span>
    </div>`;
}

    const titleText = isRefreshed ? 'Quota Data Not Available' : 'Not synced yet';
    const subText = isRefreshed
      ? 'GetUserStatus API returned real account identity & plan info, but no quota or usage statistics fields.'
      : 'Refresh this account to load quota data and active model pools.';

    document.getElementById('detail-content').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <div class="empty-title">${esc(titleText)}</div>
        <div class="empty-sub">${esc(subText)}</div>
        <button class="empty-sync-btn" id="empty-sync-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          Sync / Refresh Account
        </button>
      </div>`;

    document.getElementById('empty-sync-btn')?.addEventListener('click', () => {
      refreshAccountObj(acc);
      renderDetail();
      renderCards();
    });
    return;
  }

  const s  = acc.stats;
  const ps = (s && s.promptCredits && s.promptCredits.tot && s.promptCredits.rem !== null) ? status((s.promptCredits.rem / s.promptCredits.tot) * 100) : 'healthy';
  const fs = (s && s.flowCredits && s.flowCredits.tot && s.flowCredits.rem !== null) ? status((s.flowCredits.rem / s.flowCredits.tot) * 100) : 'healthy';
  const syncSummary = getSyncDeltaSummary(acc);

  document.getElementById('detail-content').innerHTML = `
    <div class="section-title">Quota Pools</div>
    <div class="pools-grid" id="pools-grid-${acc.id}">
      ${acc.pools.map((p, pi) => {
        const pct = Math.round((p.remainingFraction ?? 0) * 100);
        const pst = status(pct);
        const col = MUTED[pst];
        const deltaInfo = getPoolDeltaInfo(acc, p);
        const resetSentence = formatResetTimeSentence(p.resetTime || p.resetIn);
        return `
        <div class="pool-column" id="pool-col-${acc.id}-${pi}">
          <div class="pool-card" id="pool-card-${acc.id}-${pi}">
            <div class="pool-card-header">
              <div class="pool-card-title-row">
                <span class="pool-card-title">${esc(p.name)}</span>
                <svg class="pool-info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" title="Weekly limit for ${esc(p.name)}">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="12" y1="16" x2="12" y2="12"/>
                  <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
              </div>
              <div class="pool-card-subtitle">Weekly Limit</div>
            </div>

            <div class="pool-card-desc">
              You have used some of your weekly limit, it will fully refresh in ${esc(resetSentence)}.
            </div>

            <div class="pool-card-body">
              <div class="pool-pct-row">
                <span class="pool-pct-num" style="color:${col}">${pct}%</span>
                ${compactRing(pct, pst)}
              </div>
            </div>

            <div class="pool-card-footer">
              <svg class="pool-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
              <span class="pool-details-label">details</span>
            </div>
          </div>
          <div class="pool-stats-panel">
            <div class="pool-unit-breakdown">
              <div class="pool-unit-header">
                <div class="pool-unit-main">
                  <span class="pool-unit-num" style="color:${col}">${pct}%</span>
                  <span class="pool-unit-fraction">(remainingFraction: ${(p.remainingFraction ?? 0).toFixed(4)})</span>
                </div>
                ${deltaInfo ? `<span class="pool-delta-tag ${deltaInfo.cls}">${deltaInfo.text}</span>` : ''}
              </div>
              <div class="pool-bar-wrap">
                <div class="pool-bar-fill ${pst}" style="width:${pct}%"></div>
              </div>
              <div class="model-breakdown">
                ${p.models.map(m => {
                  const mpct = Math.round((m.fraction ?? 0) * 100);
                  const mst  = status(mpct);
                  return `
                  <div class="model-row">
                    <span class="model-row-name">${esc(m.name)}</span>
                    ${m.tag ? `<span class="model-tag${m.tag === 'fast' ? ' fast' : ''}">${esc(m.tag)}</span>` : ''}
                    <span class="model-row-frac" style="color:${MUTED[mst]}">${mpct}%</span>
                  </div>`;
                }).join('')}
              </div>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <div class="section-title">Usage Stats</div>
    <div class="stat-grid">
      <div class="stat-card">
        <span class="stat-label has-tooltip" data-tip="promptCredits">Prompt credits</span>
        <span class="stat-value" style="color:${MUTED[ps]}">${s && s.promptCredits && s.promptCredits.rem !== null ? fmt(s.promptCredits.rem) : 'N/A'}</span>
        <div class="stat-sub">${s && s.promptCredits && s.promptCredits.tot !== null ? `of ${fmt(s.promptCredits.tot)} total` : 'Not available'}</div>
      </div>
      <div class="stat-card">
        <span class="stat-label has-tooltip" data-tip="flowCredits">Flow credits</span>
        <span class="stat-value" style="color:${MUTED[fs]}">${s && s.flowCredits && s.flowCredits.rem !== null ? fmt(s.flowCredits.rem) : 'N/A'}</span>
        <div class="stat-sub">${s && s.flowCredits && s.flowCredits.tot !== null ? `of ${fmt(s.flowCredits.tot)} total` : 'Not available'}</div>
      </div>
      <div class="stat-card">
        <span class="stat-label has-tooltip" data-tip="maxInputTokens">Max input tokens</span>
        <span class="stat-value" style="font-size:15px;line-height:1.2">${s && s.maxInputTokens !== null ? fmt(s.maxInputTokens) : 'N/A'}</span>
        <div class="stat-sub">≈ ${s && s.maxInputTokens !== null ? words(s.maxInputTokens) : '0'} words</div>
      </div>
      <div class="stat-card">
        <span class="stat-label has-tooltip" data-tip="nextReset">Next reset</span>
        <span class="stat-value" style="font-size:12px;line-height:1.35">${s && s.nextReset ? esc(s.nextReset) : 'N/A'}</span>
        <div class="stat-sub">model reset time</div>
      </div>
    </div>

    <div class="sync-row">
      <div class="pulse-dot ${st}" aria-hidden="true"></div>
      <span class="sync-text">
        Last synced <span class="sync-time" id="det-sync">${timeSince(acc.lastSync)}</span>
        ${syncSummary ? ` · <span class="sync-delta-text">${syncSummary}</span>` : ''}
      </span>
      <button class="refresh-acc-btn" id="refresh-acc-btn" aria-label="Refresh this account">
        <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Refresh this account
      </button>
    </div>`;

  document.getElementById('refresh-acc-btn').addEventListener('click', e => {
    const btn = e.currentTarget;
    btn.classList.remove('spinning'); void btn.offsetWidth; btn.classList.add('spinning');
    refreshAccountObj(acc);
    console.info('[Lune] Refresh this account →', acc.name, acc.email);
    setTimeout(() => { renderDetail(); renderCards(); }, 550);
  });

  document.getElementById('detail-content').querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', showTip);
    el.addEventListener('mousemove',  moveTip);
    el.addEventListener('mouseleave', hideTip);
  });

  /* Pool card expand/collapse — height driven by real content (scrollHeight),
     not a guessed fixed max-height, since the model list length varies per pool */
  document.getElementById('detail-content').querySelectorAll('.pool-column').forEach(col => {
    const card  = col.querySelector('.pool-card');
    const panel = col.querySelector('.pool-stats-panel');
    if (card && panel) {
      card.addEventListener('click', () => {
        const isExpanded = col.classList.contains('expanded');
        if (isExpanded) {
          panel.style.maxHeight = '0px';
          col.classList.remove('expanded');
        } else {
          col.classList.add('expanded');
          panel.style.maxHeight = panel.scrollHeight + 'px';
        }
      });
    }
  });
}

/* ═══════════════════════════════════════════════════════
   TOOLTIP
═══════════════════════════════════════════════════════ */
const tipEl = document.getElementById('tooltip');
function showTip(e) { tipEl.textContent = TIPS[e.currentTarget.dataset.tip] || ''; tipEl.classList.add('visible'); moveTip(e); }
function hideTip()  { tipEl.classList.remove('visible'); }
function moveTip(e) {
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight, pad = 14;
  let x = e.clientX - tw / 2, y = e.clientY - th - pad;
  x = Math.max(6, Math.min(x, innerWidth  - tw - 6));
  y = y < 6 ? e.clientY + pad : y;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}

/* ═══════════════════════════════════════════════════════
   SYNC CLOCK
═══════════════════════════════════════════════════════ */
function timeSince(ts) {
  const from = ts === undefined ? lastSync : ts;
  const s = Math.round((Date.now() - from) / 1000);
  if (s < 5)    return 'just now';
  if (s < 60)   return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}
function tickSync() {
  const sub = document.getElementById('sync-subtitle');
  const det = document.getElementById('det-sync');
  if (sub) sub.textContent = 'Last synced ' + timeSince(lastSync);
  const acc = ACCOUNTS.find(a => a.id === selectedId);
  if (det && acc) det.textContent = timeSince(acc.lastSync);
}
setInterval(tickSync, 5000);

document.getElementById('refresh-btn').addEventListener('click', () => {
  const now = Date.now();
  lastSync = now;
  ACCOUNTS.forEach(a => refreshAccountObj(a));
  const btn = document.getElementById('refresh-btn');
  btn.classList.remove('spinning');
  void btn.offsetWidth;
  btn.classList.add('spinning');
  setTimeout(() => {
    btn.classList.remove('spinning');
    renderCards();
    renderDetail();
  }, 600);
});

/* Modal event bindings */
const addModal = document.getElementById('add-modal');
const addForm  = document.getElementById('add-acc-form');

function openAddModal() {
  addForm.reset();
  addModal.classList.add('open');
  document.getElementById('acc-name-input').focus();
}
function closeAddModal() {
  addModal.classList.remove('open');
}

document.getElementById('add-acc-btn').addEventListener('click', openAddModal);
document.getElementById('modal-close-btn').addEventListener('click', closeAddModal);
document.getElementById('modal-cancel-btn').addEventListener('click', closeAddModal);
addModal.addEventListener('click', e => { if (e.target === addModal) closeAddModal(); });
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && addModal.classList.contains('open')) closeAddModal();
});

addForm.addEventListener('submit', e => {
  e.preventDefault();
  const name  = document.getElementById('acc-name-input').value.trim();
  const email = document.getElementById('acc-email-input').value.trim();
  if (!name || !email) return;

  const newAccount = {
    id: Date.now(),
    rank: ACCOUNTS.length + 1,
    name: name,
    email: email,
    initials: deriveInitials(name),
    avatarBg: AVATAR_PALETTE[ACCOUNTS.length % AVATAR_PALETTE.length],
    plan: 'Unlinked',
    quotaPercent: null,
    lastSync: null,
    pools: [],
    stats: null,
    previousSnapshot: null
  };

  ACCOUNTS.push(newAccount);
  selectedId = newAccount.id;
  closeAddModal();
  renderCards();
  renderDetail();
});

/* ═══════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════ */
renderCards();
renderDetail();

/* ═══════════════════════════════════════════════════════
   TEMP: IPC BRIDGE TEST — remove/replace in next phase
   Calls window.electronAPI.ping() (exposed by preload.js)
   and shows the result so we can confirm the bridge works.
═══════════════════════════════════════════════════════ */
(function wirePingButton() {
  const btn = document.getElementById('ipc-test-btn');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    if (typeof window.electronAPI === 'undefined') {
      alert('window.electronAPI not found — are you running inside Electron?');
      return;
    }
    try {
      const result = await window.electronAPI.ping();
      console.log('[IPC bridge test] ping result:', result);
      alert('IPC bridge ✓\n\n' + result);
    } catch (err) {
      console.error('[IPC bridge test] ping failed:', err);
      alert('IPC bridge ✗\n\n' + err.message);
    }
  });
}());
</script>
